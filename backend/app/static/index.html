<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADEIQ Crypto Pro v1.0 — 24/7 USDT-M &amp; Spot Vault</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    [hidden]{display:none !important}
    body { margin: 0; background: #05070B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .card { background: #0E131F; border: 1px solid #1E293B; border-radius: 16px; }
    .drawer-bg { background: rgba(2,6,15,0.78); backdrop-filter: blur(6px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Owner Login Gate -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm p-6 space-y-4">
      <div>
        <div class="text-xl font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span> <span class="text-xs px-2 py-0.5 rounded bg-[#F5B700]/15 text-[#F5B700]">CRYPTO PRO</span></div>
        <p class="text-xs text-slate-400 mt-1">Owner Password Required • 534+ Live Coins • Spot Vault</p>
      </div>
      <div id="login-err" class="hidden text-xs text-[#FF3B5C] bg-[#FF3B5C]/10 border border-[#FF3B5C]/30 rounded-xl px-3 py-2"></div>
      <input id="login-pwd" type="password" placeholder="Enter Owner Password" class="w-full px-3.5 py-2.5 rounded-xl bg-[#090D16] border border-[#24324A] text-white text-sm focus:outline-none focus:border-[#00E676]" />
      <button id="login-btn" class="w-full py-2.5 rounded-xl bg-[#00E676] text-[#04120B] font-extrabold text-sm">Unlock Crypto Desk</button>
    </div>
  </div>

  <!-- Authenticated App View (Hidden until Owner JWT verified) -->
  <div id="app-view" hidden class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 bg-[#05070B]/95 backdrop-blur-md border-b border-[#1E293B]">
      <div class="max-w-5xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <button id="menu-open" class="w-10 h-10 rounded-xl bg-[#0E131F] border border-[#243045] flex items-center justify-center text-white shrink-0">☰</button>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-base sm:text-lg font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span></span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#F5B700]/15 text-[#F5B700] border border-[#F5B700]/35">PRO</span>
            </div>
            <p id="sec-label" class="text-[11px] text-slate-400 truncate leading-none mt-0.5">Crypto Trading Desk • 534+ Coins</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-[#0E131F] border border-[#1E293B]">
            <span id="ws-dot" class="w-2 h-2 rounded-full bg-[#00E676]"></span>
            <span id="ws-txt" class="text-xs font-bold text-[#00E676] mono">24/7 LIVE</span>
          </div>
          <button id="scan-btn" class="px-3 py-1.5 rounded-xl bg-[#00E676] text-[#04120B] font-bold text-xs">Scan</button>
        </div>
      </div>
      <div class="border-t border-[#141C2D] bg-[#080C15]">
        <div id="majors-bar" class="max-w-5xl mx-auto px-3 sm:px-5 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
      </div>
    </header>

    <!-- Slide-out Drawer -->
    <div id="drawer" class="fixed inset-0 z-50 hidden">
      <div id="drawer-bg" class="absolute inset-0 drawer-bg"></div>
      <aside class="relative w-72 max-w-[85vw] h-full bg-[#090D16] border-r border-[#1E293B] p-4 flex flex-col justify-between overflow-y-auto">
        <div>
          <div class="flex items-center justify-between pb-4 border-b border-[#1E293B]">
            <div class="text-lg font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span> <span class="text-xs text-[#F5B700]">CRYPTO PRO</span></div>
            <button id="menu-close" class="w-8 h-8 rounded-lg bg-[#141B2D] text-slate-300">✕</button>
          </div>
          <nav id="drawer-nav" class="mt-4 space-y-1.5"></nav>
        </div>
        <div class="pt-4 border-t border-[#1E293B] space-y-2">
          <div class="flex justify-between text-xs px-2"><span class="text-slate-400">Supabase</span><span class="text-[#00E676] font-bold">PROTECTED</span></div>
          <button id="logout-btn" class="w-full py-2 rounded-xl bg-[#141B2D] border border-[#263449] text-xs font-bold text-slate-300">Lock / Sign Out</button>
        </div>
      </aside>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden max-w-xs bg-[#141B2D] border border-[#00E676]/45 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold"></div>
    <main id="content" class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-5 py-4 space-y-4"></main>
  </div>

  <script>
    const TOKEN_KEY = 'tradeiq.crypto.session';
    let authToken = sessionStorage.getItem(TOKEN_KEY) || null;
    let section = 'desk';
    let horizon = 'intraday';
    let labFilter = 'ALL';
    let chartSym = 'BTCUSDT';
    let chartTf = '1m';
    let marketSearch = '';
    let marketSort = 'volume';
    let overview = null;
    let spotData = null;
    let marketsData = null;
    let boomData = [];
    let catalystData = [];
    let connData = null;
    let tvChart = null;
    let candleSeriesRef = null;
    let volSeriesRef = null;
    let okxPublicWs = null;
    let okxCandleWs = null;
    let okxPingTimer = null;
    let okxReconnectTimer = null;
    let lastBarRef = null;
    let liveFpBuy = 0;
    let liveFpSell = 0;
    let lastLivePx = 0;
    let chartStreamActive = false;
    let ws = null;

    function closeExchangeChartSockets() {
      chartStreamActive = false;
      if (okxPingTimer) { clearInterval(okxPingTimer); okxPingTimer = null; }
      if (okxReconnectTimer) { clearTimeout(okxReconnectTimer); okxReconnectTimer = null; }
      try { if (okxPublicWs) { okxPublicWs.onclose = null; okxPublicWs.close(); } } catch {}
      try { if (okxCandleWs) { okxCandleWs.onclose = null; okxCandleWs.close(); } } catch {}
      okxPublicWs = null;
      okxCandleWs = null;
    }

    function connectOkxDirectMsStream(sym, tf) {
      closeExchangeChartSockets();
      chartStreamActive = true;
      const instId = sym.endsWith('USDT') ? sym.slice(0, -4) + '-USDT-SWAP' : sym;
      const okxBar = { '1m':'candle1m', '5m':'candle5m', '15m':'candle15m', '1h':'candle1H', '4h':'candle4H', '1d':'candle1D' }[tf] || 'candle1m';
      liveFpBuy = 0;
      liveFpSell = 0;

      const scheduleReconnect = () => {
        if (!chartStreamActive || section !== 'chart') return;
        if (okxReconnectTimer) return;
        okxReconnectTimer = setTimeout(() => {
          okxReconnectTimer = null;
          if (chartStreamActive && section === 'chart') connectOkxDirectMsStream(sym, tf);
        }, 1200);
      };

      try {
        okxPublicWs = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        okxPublicWs.onopen = () => {
          okxPublicWs.send(JSON.stringify({
            op: 'subscribe',
            args: [
              { channel: 'tickers', instId },
              { channel: 'books5', instId },
              { channel: 'trades', instId }
            ]
          }));
        };
        okxPublicWs.onclose = scheduleReconnect;
        okxPublicWs.onerror = () => { try { okxPublicWs.close(); } catch {} };
        okxPublicWs.onmessage = (ev) => {
          if (ev.data === 'pong') return;
          try {
            const msg = JSON.parse(ev.data);
            const ch = msg?.arg?.channel;
            const d = msg?.data?.[0];
            if (!d) return;

            if (ch === 'tickers') {
              const px = Number(d.last);
              const op24 = Number(d.open24h || px);
              const pct = op24 > 0 ? (((px - op24) / op24) * 100) : 0;
              const ltpEl = document.getElementById('ch-ltp');
              const chgEl = document.getElementById('ch-chg');
              if (ltpEl) {
                ltpEl.textContent = '$' + d.last;
                ltpEl.style.color = px >= lastLivePx ? '#00E676' : '#FF3B5C';
                lastLivePx = px;
              }
              if (chgEl) {
                chgEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
                chgEl.style.color = pct >= 0 ? '#00E676' : '#FF3B5C';
              }
              if (candleSeriesRef && lastBarRef && Number.isFinite(px) && px > 0) {
                lastBarRef.close = px;
                if (px > lastBarRef.high) lastBarRef.high = px;
                if (px < lastBarRef.low) lastBarRef.low = px;
                candleSeriesRef.update(lastBarRef);
              }
            } else if (ch === 'books5') {
              const bids = d.bids || [];
              const asks = d.asks || [];
              const bq = bids.reduce((a, x) => a + Number(x[1] || 0), 0);
              const aq = asks.reduce((a, x) => a + Number(x[1] || 0), 0);
              const bp = (bq + aq) > 0 ? ((bq / (bq + aq)) * 100).toFixed(1) : '50.0';
              const pres = Number(bp) >= 58 ? 'BUY_IMBALANCE' : (Number(bp) <= 42 ? 'SELL_IMBALANCE' : 'BALANCED');
              const obBox = document.getElementById('ob-box');
              if (obBox) {
                obBox.innerHTML = `<div class="flex justify-between mb-2"><span class="text-sm font-extrabold text-white">Live Millisecond 5-Level L2 Orderbook</span><span class="text-xs font-bold ${Number(bp)>=50?'text-[#00E676]':'text-[#FF3B5C]'}">${pres} (${bp}% Buy)</span></div>
                  <div class="grid grid-cols-2 gap-3 text-xs mono">
                    <div class="space-y-1">${bids.slice(0,5).map(b => `<div class="flex justify-between px-2 py-1 rounded bg-[#00E676]/10"><span class="text-[#00E676]">$${b[0]}</span><span>${b[1]}</span></div>`).join('')}</div>
                    <div class="space-y-1">${asks.slice(0,5).map(a => `<div class="flex justify-between px-2 py-1 rounded bg-[#FF3B5C]/10"><span class="text-[#FF3B5C]">$${a[0]}</span><span>${a[1]}</span></div>`).join('')}</div>
                  </div>`;
              }
            } else if (ch === 'trades') {
              for (const tr of (msg.data || [])) {
                const val = Number(tr.sz || 0) * Number(tr.px || 0);
                if (tr.side === 'buy') liveFpBuy += val;
                else liveFpSell += val;
              }
              if ((liveFpBuy + liveFpSell) > 5000000) { liveFpBuy *= 0.5; liveFpSell *= 0.5; }
              const tot = liveFpBuy + liveFpSell;
              if (tot > 0) {
                const dp = (((liveFpBuy - liveFpSell) / tot) * 100).toFixed(1);
                const bias = Number(dp) >= 10 ? 'BUY_ABSORPTION' : (Number(dp) <= -10 ? 'SELL_ABSORPTION' : 'NEUTRAL');
                const fpBox = document.getElementById('fp-box');
                if (fpBox) {
                  fpBox.innerHTML = `<div class="flex items-center justify-between flex-wrap gap-2">
                    <div><div class="text-sm font-extrabold text-white">Live Millisecond Tick Footprint &amp; CVD (${sym})</div>
                    <div class="text-[11px] text-slate-400">Direct OKX exchange tick stream • Keep-Alive Ping ON ⚡</div></div>
                    <span class="text-xs font-extrabold mono px-2.5 py-1 rounded-lg ${Number(dp)>=0?'bg-[#00E676]/15 text-[#00E676]':'bg-[#FF3B5C]/15 text-[#FF3B5C]'}">${bias} (${Number(dp)>=0?'+':''}${dp}%)</span>
                  </div>`;
                }
              }
            }
          } catch {}
        };
      } catch {}

      try {
        okxCandleWs = new WebSocket('wss://ws.okx.com:8443/ws/v5/business');
        okxCandleWs.onopen = () => {
          okxCandleWs.send(JSON.stringify({
            op: 'subscribe',
            args: [{ channel: okxBar, instId }]
          }));
        };
        okxCandleWs.onclose = scheduleReconnect;
        okxCandleWs.onerror = () => { try { okxCandleWs.close(); } catch {} };
        okxCandleWs.onmessage = (ev) => {
          if (ev.data === 'pong') return;
          try {
            const msg = JSON.parse(ev.data);
            const row = msg?.data?.[0];
            if (!row || !candleSeriesRef || !volSeriesRef) return;
            const ts = Math.floor(Number(row[0]) / 1000);
            const o = Number(row[1]), h = Number(row[2]), l = Number(row[3]), cl = Number(row[4]), v = Number(row[5]);
            lastBarRef = { time: ts, open: o, high: h, low: l, close: cl };
            candleSeriesRef.update(lastBarRef);
            volSeriesRef.update({ time: ts, value: v, color: cl >= o ? 'rgba(0,230,118,0.32)' : 'rgba(255,59,92,0.32)' });
          } catch {}
        };
      } catch {}

      okxPingTimer = setInterval(() => {
        try { if (okxPublicWs && okxPublicWs.readyState === 1) okxPublicWs.send('ping'); } catch {}
        try { if (okxCandleWs && okxCandleWs.readyState === 1) okxCandleWs.send('ping'); } catch {}
      }, 18000);
    }

    function showLogin(msg) {
      authToken = null;
      sessionStorage.removeItem(TOKEN_KEY);
      closeExchangeChartSockets();
      document.getElementById('app-view').hidden = true;
      document.getElementById('login-view').hidden = false;
      const err = document.getElementById('login-err');
      if (msg) { err.textContent = msg; err.classList.remove('hidden'); }
      else err.classList.add('hidden');
    }

    function showToast(m) {
      const t = document.getElementById('toast');
      t.textContent = m; t.classList.remove('hidden');
      clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.add('hidden'), 3200);
    }

    async function apiFetch(path, opts = {}) {
      if (!authToken) { showLogin('Please sign in.'); throw new Error('401'); }
      const headers = Object.assign({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken }, opts.headers || {});
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      if (res.status === 401) { showLogin('Session expired. Sign in again.'); throw new Error('401'); }
      return res.json();
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const pwd = document.getElementById('login-pwd').value;
      const res = await fetch('/api/v1/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      if (!res.ok) { showLogin('Incorrect owner password.'); return; }
      const d = await res.json();
      authToken = d.access_token;
      sessionStorage.setItem(TOKEN_KEY, authToken);
      bootApp();
    });

    function fmtU(n) { const v = Number(n || 0); return (v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function fmtR(n) { const v = Number(n || 0); return (v < 0 ? '-' : '') + '₹' + Math.abs(v).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
    function fmtVol(v) { const n = Number(v || 0); if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B'; if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M'; return '$' + n.toFixed(0); }

    function renderMajors() {
      const bar = document.getElementById('majors-bar');
      const majors = overview?.majors || [];
      const inr = overview?.usdt_inr || '85.20';
      bar.innerHTML = majors.map(m => {
        const up = Number(m.change_24h_pct) >= 0;
        return `<button onclick="openChart('${m.symbol}')" class="shrink-0 flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#0E131F] border border-[#1E293B]">
          <span class="text-[11px] font-bold text-slate-300">${m.symbol.replace('USDT','')}</span>
          <span class="text-xs font-bold text-white mono">$${m.ltp}</span>
          <span class="text-[11px] font-bold mono px-1.5 py-0.5 rounded ${up ? 'text-[#00E676] bg-[#00E676]/10' : 'text-[#FF3B5C] bg-[#FF3B5C]/10'}">${up ? '+' : ''}${m.change_24h_pct}%</span>
        </button>`;
      }).join('') + `<div class="shrink-0 px-2.5 py-1.5 rounded-xl bg-[#0E131F] border border-[#1E293B] text-[11px]"><span class="text-slate-400">USDT/INR </span><strong class="text-[#F5B700] mono">₹${inr}</strong></div>`;
    }

    function renderNav() {
      const items = [
        { id: 'desk', icon: '⚡', t: 'Crypto Trading Desk', s: 'Intraday • Reversion • Trend • Boom' },
        { id: 'spot', icon: '🪙', t: 'Spot Buy Vault (No SL)', s: '3-Step Smart DCA • Blue-Chip Bounce' },
        { id: 'markets', icon: '🌐', t: 'All 534+ Live Markets', s: 'Search & Sort Full OKX Exchange' },
        { id: 'chart', icon: '🕯️', t: 'Live Candlestick & Depth', s: '1m–1d TradingView + Footprint CVD' },
        { id: 'boom', icon: '🚀', t: 'Daily Boom Radar', s: 'Dynamic 534-Coin Explosive Movers' },
        { id: 'catalyst', icon: '🌍', t: 'Macro & Catalyst Radar', s: 'Musk • Trump • Fed • SEC News' },
        { id: 'lab', icon: '🧪', t: 'Accuracy Lab vs Elite TG', s: `Top ${overview?.tg_daily_cap || 6}/day TG vs All Lab` },
        { id: 'portfolio', icon: '💼', t: 'Portfolio & Supabase', s: 'Settings & Permanent Ledger' },
        { id: 'system', icon: '⚙️', t: 'System & Exchange Feeds', s: overview?.active_exchange || 'OKX v5 Primary' }
      ];
      document.getElementById('drawer-nav').innerHTML = items.map(i => `
        <button onclick="goSec('${i.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left border ${section === i.id ? 'bg-[#00E676]/15 border-[#00E676]/45 text-white' : 'border-transparent text-slate-300'}">
          <span>${i.icon}</span><div class="min-w-0"><div class="text-sm font-bold truncate">${i.t}</div><div class="text-[11px] text-slate-400 truncate">${i.s}</div></div>
        </button>`).join('');
    }

    window.goSec = async (s) => {
      section = s;
      closeExchangeChartSockets();
      document.getElementById('drawer').classList.add('hidden');
      if (s === 'spot') { spotData = await apiFetch('/api/v1/spot/overview'); }
      if (s === 'markets') await loadMarkets();
      if (s === 'boom') { const r = await apiFetch('/api/v1/crypto/boom'); boomData = r.items || []; }
      if (s === 'catalyst') { const r = await apiFetch('/api/v1/crypto/catalysts'); catalystData = r.items || []; }
      if (s === 'system') { connData = await apiFetch('/api/v1/system/connectivity'); }
      render();
      if (s === 'chart') {
        await loadChart(true);
      }
    };

    window.loadMarkets = async () => {
      marketsData = await apiFetch(`/api/v1/crypto/markets?q=${encodeURIComponent(marketSearch)}&sort=${encodeURIComponent(marketSort)}&limit=120`);
      if (section === 'markets') render();
    };
    window.setMarketSort = async (s) => { marketSort = s; await loadMarkets(); };
    window.onMarketSearch = async (val) => { marketSearch = val; await loadMarkets(); };
    window.setHor = (h) => { horizon = h; render(); };
    window.setLabF = (f) => { labFilter = f; render(); };
    window.openChart = (sym) => { chartSym = sym.toUpperCase().endsWith('USDT') ? sym.toUpperCase() : (sym.toUpperCase() + 'USDT'); goSec('chart'); };
    window.setTf = (tf) => { chartTf = tf; loadChart(true); };

    window.scanSpotVault = async () => {
      showToast('Scanning Top 10 Blue-Chips (4-Point Bounce Check)...');
      const r = await apiFetch('/api/v1/spot/scan', { method: 'POST', body: JSON.stringify({ execute_entries: true }) });
      showToast(`Blue-Chips: ${r.buy_ready_count} Buy Ready • ${r.opened_count} Opened`);
      spotData = await apiFetch('/api/v1/spot/overview');
      render();
    };
    window.saveSpotCfg = async () => {
      await apiFetch('/api/v1/spot/config', {
        method: 'PUT',
        body: JSON.stringify({
          per_coin_budget_usdt: Number(document.getElementById('sp-budget').value),
          target_net_pct: Number(document.getElementById('sp-tgt').value),
          max_active_coins: Number(document.getElementById('sp-max').value),
          enabled: document.getElementById('sp-auto').value === 'true'
        })
      });
      showToast('Spot Vault settings saved');
      spotData = await apiFetch('/api/v1/spot/overview');
      await refreshCore();
    };
    window.quickSpotBuy = async (symOverride) => {
      const sym = symOverride || (document.getElementById('sp-buy-sym')?.value || '').trim().toUpperCase();
      if (!sym) { showToast('Enter a coin symbol (e.g. BTC, ETH, SOL)'); return; }
      const budget = Number(document.getElementById('sp-buy-amt')?.value || spotData?.config?.per_coin_budget_usdt || 120);
      const tgt = Number(document.getElementById('sp-buy-tgt')?.value || spotData?.config?.target_net_pct || 5.0);
      const single = (document.getElementById('sp-buy-mode')?.value === 'single');
      const r = await apiFetch('/api/v1/spot/buy', {
        method: 'POST',
        body: JSON.stringify({ symbol: sym, budget_usdt: budget, target_net_pct: tgt, single_shot: single })
      });
      if (r.opened) {
        showToast(`🪙 Spot Bought ${r.symbol} @ $${r.avg_entry_price} (Target $${r.net_target_price})`);
        spotData = await apiFetch('/api/v1/spot/overview');
        render();
      } else {
        showToast(r.detail || 'Could not execute Spot Buy');
      }
    };
    window.addSpotDca = async (pid) => {
      const r = await apiFetch('/api/v1/spot/positions/' + encodeURIComponent(pid) + '/dca', { method: 'POST', body: '{}' });
      showToast(r.updated ? `DCA #${r.tranches_filled} filled • Avg $${r.avg_entry_price}` : (r.detail || 'DCA unavailable'));
      spotData = await apiFetch('/api/v1/spot/overview');
      render();
    };
    window.sellSpotPos = async (pid) => {
      const r = await apiFetch('/api/v1/spot/positions/' + encodeURIComponent(pid) + '/sell', { method: 'POST', body: '{}' });
      showToast(`Spot Sold • Net P&L: ${fmtU(r.net_pnl_usdt)}`);
      spotData = await apiFetch('/api/v1/spot/overview');
      await refreshCore();
    };
    window.delSpotPos = async (pid) => {

                    <div class="text-[10px] text-slate-400 mt-1">RSI ${r.rsi_15m} • CVD ${Number(r.footprint_delta_pct)>=0?'+':''}${r.footprint_delta_pct}% • L2 ${r.buy_pct}% Buy</div>
                    <div class="text-[10px] text-[#00E676] truncate mt-0.5">${(r.passed_rules||[]).slice(0,2).join(' • ')}</div>
                  </div>
                  <div class="flex flex-col items-end gap-1.5 shrink-0">
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${badgeCol}">${r.stage} (${r.checks_passed}/4)</span>
                    <button onclick="quickSpotBuy('${r.symbol}')" class="px-2.5 py-1 rounded-lg bg-[#141B2D] border border-[#00E676]/40 text-[10px] font-bold text-[#00E676]">Spot Buy</button>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>

          <div class="card p-4">
            <h3 class="text-sm font-extrabold text-white">⚙️ Spot Vault Settings (Editable Anytime)</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3 text-xs">
              <div><label class="text-slate-400">Per-Coin Budget ($)</label><input id="sp-budget" type="number" value="${scfg.per_coin_budget_usdt||120}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
              <div><label class="text-slate-400">Net Target %</label><input id="sp-tgt" type="number" step="0.5" value="${scfg.target_net_pct||5.0}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
              <div><label class="text-slate-400">Max Active Coins</label><input id="sp-max" type="number" value="${scfg.max_active_coins||3}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
              <div><label class="text-slate-400">Auto Blue-Chip Scan</label><select id="sp-auto" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white"><option value="true" ${scfg.enabled!==false?'selected':''}>ON</option><option value="false" ${scfg.enabled===false?'selected':''}>OFF (Manual Only)</option></select></div>
            </div>
            <button onclick="saveSpotCfg()" class="mt-3 px-4 py-2 rounded-xl bg-[#00E676] text-[#04120B] font-bold text-xs">Save Spot Settings</button>
          </div>

          <div class="card p-4">
            <h3 class="text-sm font-extrabold text-white mb-2">Closed Spot Profit Ledger (${sClosed.length})</h3>
            <div class="space-y-2">${sClosed.length === 0 ? `<div class="text-xs text-slate-500">No closed spot trades yet.</div>` : sClosed.map(c => `<div class="p-3 rounded-xl bg-[#090D16] border border-[#1B2436] flex justify-between items-center"><div><span class="text-sm font-bold text-white">${c.symbol}</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#00E676]/15 text-[#00E676]">${c.outcome}</span><div class="text-[11px] text-slate-500">Avg $${c.avg_entry_price} → $${c.exit_fill_price} • DCA ${c.tranches_filled}/${c.max_tranches} • ${c.exit_reason}</div></div><div class="flex items-center gap-3"><span class="mono text-sm font-bold ${Number(c.net_pnl_usdt)>=0?'text-[#00E676]':'text-[#FF3B5C]'}">${Number(c.net_pnl_usdt)>=0?'+':''}${fmtU(c.net_pnl_usdt)}</span><button onclick="delSpotPos('${c.position_id}')" class="text-[10px] text-slate-400 hover:text-[#FF3B5C]">Delete</button></div></div>`).join('')}</div>
          </div>`;
      } else if (section === 'markets') {
        const items = marketsData?.items || [];
        el.innerHTML = `
          <div class="card p-4 space-y-3">
            <div class="flex flex-wrap justify-between items-center gap-2">
              <div><h2 class="text-base font-extrabold text-white">🌐 All ${marketsData?.total_market_coins || '534+'} Live OKX USDT Coins</h2><p class="text-xs text-slate-400">Tap any coin to open real-time 1m–1d Candlesticks, Footprint CVD &amp; L2 Orderbook.</p></div>
            </div>
            <div class="flex flex-wrap gap-2">
              <input value="${marketSearch}" oninput="onMarketSearch(this.value)" placeholder="Search coin (BTC, PEPE, SUI, WIF...)" class="flex-1 min-w-[180px] px-3 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-xs text-white uppercase" />
              ${[
                { id:'volume', l:'Top Volume' },
                { id:'gainers', l:'🚀 Top Gainers' },
                { id:'losers', l:'🔻 Top Losers' }
              ].map(s => `<button onclick="setMarketSort('${s.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold border ${marketSort===s.id?'bg-[#00E676] text-[#04120B] border-[#00E676]':'bg-[#141B2D] text-slate-300 border-[#263449]'}">${s.l}</button>`).join('')}
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            ${items.map(m => {
              const up = Number(m.change_24h_pct) >= 0;
              return `<button onclick="openChart('${m.symbol}')" class="card p-3 flex items-center justify-between text-left hover:border-[#00D4FF] transition">
                <div><div class="text-sm font-extrabold text-white">${m.symbol}</div><div class="text-[10px] text-slate-400">24h Vol: ${fmtVol(m.volume_24h_usdt)}</div></div>
                <div class="text-right mono"><div class="text-sm font-bold text-white">$${m.ltp}</div><div class="text-xs font-bold ${up?'text-[#00E676]':'text-[#FF3B5C]'}">${up?'+':''}${m.change_24h_pct}%</div></div>
              </button>`;
            }).join('')}
          </div>`;
      } else if (section === 'boom') {
        el.innerHTML = `<div class="card p-4 border-[#A855F7]/40"><h2 class="text-base font-extrabold text-white">🚀 Daily Boom Radar (534-Coin Dynamic • Strict 1x)</h2><p class="text-xs text-slate-400 mt-0.5">Screens ALL 534+ OKX coins for +4% to +30% volume breakouts with Footprint Anti-Dump protection.</p></div>
          <div class="space-y-2.5">${boomData.map(b => `<button onclick="openChart('${b.symbol}')" class="w-full text-left card p-4 hover:border-[#A855F7] transition"><div class="flex justify-between items-start gap-2"><div><span class="text-base font-extrabold text-white">${b.symbol}</span> <span class="text-xs mono text-slate-300">$${b.ltp}</span> <span class="text-xs mono font-bold text-[#00E676]">${Number(b.change_24h_pct)>=0?'+':''}${b.change_24h_pct}%</span><div class="text-[11px] text-slate-400 mt-1">${(b.checks||[]).join(' • ')}</div></div><span class="text-[10px] font-bold px-2 py-1 rounded bg-[#A855F7]/20 text-[#D8B4FE]">${b.stage} (${b.score})</span></div></button>`).join('')}</div>`;
      } else if (section === 'catalyst') {
        el.innerHTML = `<div class="card p-4 border-[#F5B700]/35"><h2 class="text-base font-extrabold text-white">⚡ Macro &amp; Catalyst Radar (Musk / Trump / Fed / SEC)</h2></div>
          <div class="space-y-2.5">${catalystData.map(n => `<a href="${n.url||'#'}" target="_blank" rel="noreferrer" class="block card p-4"><div class="flex justify-between text-[10px]"><span class="font-bold text-[#F5B700]">${n.tag}</span><span class="text-slate-400">${n.source}</span></div><div class="text-sm font-bold text-white mt-1">${n.headline}</div><div class="mt-2 flex gap-1.5 flex-wrap text-[10px]">${(n.mapped_coins||[]).map(c=>`<span class="px-2 py-0.5 rounded bg-[#141B2D] text-[#00D4FF] mono font-bold">${c}</span>`).join('')}<span class="px-2 py-0.5 rounded bg-slate-800 text-slate-200 font-bold">${n.impact}</span></div></a>`).join('')}</div>`;
      } else if (section === 'lab') {
        const list = openPos.filter(p => labFilter==='ALL' || p.tier===labFilter);
        el.innerHTML = `<div class="card p-4 flex justify-between items-center flex-wrap gap-2"><div><h2 class="text-base font-extrabold text-white">🧪 Backend Accuracy Lab vs ⭐ Telegram Elite</h2></div><div class="flex gap-1.5">${['ALL','ELITE_TG','BACKEND_LAB'].map(f=>`<button onclick="setLabF('${f}')" class="px-3 py-1 rounded-xl text-xs font-bold border ${labFilter===f?'bg-[#00E676] text-[#04120B] border-[#00E676]':'bg-[#141B2D] text-slate-300 border-[#263449]'}">${f}</button>`).join('')}</div></div>
          <div class="space-y-2">${list.map(p=>`<div class="card p-3.5 flex justify-between items-center"><div><div class="text-sm font-bold text-white">${p.symbol} <span class="text-[10px] px-1.5 py-0.5 rounded bg-[#141B2D] text-[#F5B700]">${p.tier}</span></div><div class="text-[11px] text-slate-400">${p.engine_code} • Score ${p.score}</div></div><div class="text-right mono text-sm font-bold ${Number(p.unrealised_net_usdt)>=0?'text-[#00E676]':'text-[#FF3B5C]'}">${fmtU(p.unrealised_net_usdt)}</div></div>`).join('')}</div>`;
      } else if (section === 'portfolio') {
        const cfg = overview?.config || {};
        el.innerHTML = `<div class="card p-4"><h2 class="text-base font-extrabold text-white">Portfolio &amp; Permanent Supabase Sync</h2><p class="text-xs text-slate-400 mt-0.5">Trades survive every code push &amp; Render restart. Only manual Delete removes a trade.</p>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3 text-xs">
            <div><label class="text-slate-400">Start USDT</label><input id="c-start" type="number" value="${cfg.starting_usdt||1000}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
            <div><label class="text-slate-400">Per-Trade USDT</label><input id="c-per" type="number" value="${cfg.per_trade_usdt||200}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
            <div><label class="text-slate-400">Max Leverage</label><input id="c-lev" type="number" step="0.5" value="${cfg.max_leverage||2}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
            <div><label class="text-slate-400">TG Elite Cap/24h</label><input id="c-tg" type="number" value="${cfg.telegram_daily_cap||6}" class="mt-1 w-full px-2.5 py-2 rounded-xl bg-[#090D16] border border-[#24324A] text-white mono"/></div>
          </div>
          <button onclick="saveCfg()" class="mt-3 px-4 py-2 rounded-xl bg-[#00E676] text-[#04120B] font-bold text-xs">Save Settings</button></div>
          <div class="card p-4"><h3 class="text-sm font-extrabold text-white mb-2">Closed Ledger (${closed.length})</h3><div class="space-y-2">${closed.map(c=>`<div class="p-3 rounded-xl bg-[#090D16] border border-[#1B2436] flex justify-between items-center"><div><span class="text-sm font-bold text-white">${c.symbol}</span> <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800">${c.outcome}</span><div class="text-[11px] text-slate-500">${c.engine_code} • ${c.exit_reason}</div></div><div class="flex items-center gap-3"><span class="mono text-sm font-bold ${Number(c.net_pnl_usdt)>=0?'text-[#00E676]':'text-[#FF3B5C]'}">${fmtU(c.net_pnl_usdt)}</span><button onclick="delPos('${c.position_id}')" class="text-[10px] text-slate-400 hover:text-[#FF3B5C]">Delete</button></div></div>`).join('')}</div></div>`;
      } else if (section === 'system') {
        el.innerHTML = `<div class="card p-4"><div class="flex justify-between items-center"><h2 class="text-base font-extrabold text-white">System &amp; 3-Tier Exchange Feeds</h2><button onclick="apiFetch('/api/v1/telegram/test',{method:'POST',body:'{}'}).then(()=>showToast('Telegram test sent'))" class="px-3 py-1.5 rounded-xl bg-[#00D4FF]/15 text-[#00D4FF] text-xs font-bold">Test Telegram</button></div>
          <div class="mt-3 space-y-2">${(connData?.services||[]).map(s=>`<div class="p-3 rounded-xl bg-[#090D16] border border-[#1B2436] flex justify-between items-center"><div><div class="text-xs font-bold text-white">${s.name}</div><div class="text-[11px] text-slate-400">${s.detail}</div></div><span class="text-[10px] font-bold px-2 py-1 rounded ${s.ok?'bg-[#00E676]/15 text-[#00E676]':'bg-[#FF3B5C]/15 text-[#FF3B5C]'}">${s.ok?'CONNECTED':'FAILOVER'}</span></div>`).join('')}</div></div>`;
      }
    }

    async function refreshCore() {
      overview = await apiFetch('/api/v1/crypto/overview');
      if (section === 'spot') spotData = await apiFetch('/api/v1/spot/overview');
      render();
    }

    function connectWs() {
      if (!authToken) return;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/api/v1/ws/live?token=${encodeURIComponent(authToken)}`);
      ws.onmessage = (ev) => {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === 'LIVE_TICK' && overview) {
            overview.majors = m.majors; overview.ledger = m.ledger; overview.usdt_inr = m.usdt_inr;
            renderMajors();
            if (section === 'desk') render();
          }
        } catch {}
      };
      ws.onclose = () => { setTimeout(connectWs, 3000); };
    }

    async function bootApp() {
      document.getElementById('login-view').hidden = true;
      document.getElementById('app-view').hidden = false;
      await refreshCore();
      connectWs();
      setInterval(refreshCore, 30000);
    }

    document.getElementById('menu-open').addEventListener('click', () => document.getElementById('drawer').classList.remove('hidden'));
    document.getElementById('menu-close').addEventListener('click', () => document.getElementById('drawer').classList.add('hidden'));
    document.getElementById('drawer-bg').addEventListener('click', () => document.getElementById('drawer').classList.add('hidden'));
    document.getElementById('logout-btn').addEventListener('click', () => showLogin('Signed out.'));
    document.getElementById('scan-btn').addEventListener('click', async () => {
      showToast('Scanning all 534+ live OKX coins...');
      const r = await apiFetch('/api/v1/crypto/scan', { method: 'POST', body: JSON.stringify({ execute_entries: true }) });
      showToast(`Screened ${r.market_universe_screened || 534} coins • ${r.opened_count} opened`);
      await refreshCore();
    });

    if (authToken) bootApp();
  </script>
</body>
</html>
