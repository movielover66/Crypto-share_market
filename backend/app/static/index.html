<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRADEIQ Crypto Pro v2.1 — 12-Pt Chart Reader &amp; 6-Guard INR Desk</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    [hidden]{display:none !important}
    body { margin: 0; background: #05070B; color: #F8FAFC; font-family: 'Inter', sans-serif; overflow-x: hidden; }
    .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
    .card { background: #0E131F; border: 1px solid #1E293B; border-radius: 16px; }
    .drawer-bg { background: rgba(2,6,15,0.78); backdrop-filter: blur(6px); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Owner Login Gate -->
  <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
    <div class="card w-full max-w-sm p-6 space-y-4">
      <div>
        <div class="text-xl font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span> <span class="text-xs px-2 py-0.5 rounded bg-[#F5B700]/15 text-[#F5B700]">CRYPTO PRO</span></div>
        <p class="text-xs text-slate-400 mt-1">Owner Password Required • Full INR View • Spot Vault</p>
      </div>
      <div id="login-err" class="hidden text-xs text-[#FF3B5C] bg-[#FF3B5C]/10 border border-[#FF3B5C]/30 rounded-xl px-3 py-2"></div>
      <input id="login-pwd" type="password" placeholder="Enter Owner Password" class="w-full px-3.5 py-2.5 rounded-xl bg-[#090D16] border border-[#24324A] text-white text-sm focus:outline-none focus:border-[#00E676]" />
      <button id="login-btn" class="w-full py-2.5 rounded-xl bg-[#00E676] text-[#04120B] font-extrabold text-sm">Unlock Crypto Desk</button>
    </div>
  </div>

  <!-- Authenticated App View -->
  <div id="app-view" hidden class="min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 bg-[#05070B]/95 backdrop-blur-md border-b border-[#1E293B]">
      <div class="max-w-5xl mx-auto px-3 sm:px-5 h-14 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <button id="menu-open" class="w-10 h-10 rounded-xl bg-[#0E131F] border border-[#243045] flex items-center justify-center text-white shrink-0">☰</button>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="text-base sm:text-lg font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span></span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#F5B700]/15 text-[#F5B700] border border-[#F5B700]/35">PRO</span>
            </div>
            <p id="sec-label" class="text-[11px] text-slate-400 truncate leading-none mt-0.5">Crypto INR Desk • 534+ Coins</p>
          </div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="curr-btn" onclick="toggleCurrency()" class="px-2.5 py-1.5 rounded-xl bg-[#0E131F] border border-[#F5B700]/45 text-xs font-extrabold text-[#F5B700] mono">₹ INR</button>
          <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-[#0E131F] border border-[#1E293B]">
            <span id="ws-dot" class="w-2 h-2 rounded-full bg-[#00E676]"></span>
            <span id="ws-txt" class="text-xs font-bold text-[#00E676] mono">24/7 LIVE</span>
          </div>
          <button id="scan-btn" class="px-3 py-1.5 rounded-xl bg-[#00E676] text-[#04120B] font-bold text-xs">Scan</button>
        </div>
      </div>
      <div class="border-t border-[#141C2D] bg-[#080C15]">
        <div id="majors-bar" class="max-w-5xl mx-auto px-3 sm:px-5 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar"></div>
      </div>
      <div id="brain-sticky" class="border-t border-[#141C2D] bg-[#070B13]"></div>
    </header>

    <!-- Slide-out Drawer -->
    <div id="drawer" class="fixed inset-0 z-50 hidden">
      <div id="drawer-bg" class="absolute inset-0 drawer-bg"></div>
      <aside class="relative w-72 max-w-[85vw] h-full bg-[#090D16] border-r border-[#1E293B] p-4 flex flex-col justify-between overflow-y-auto">
        <div>
          <div class="flex items-center justify-between pb-4 border-b border-[#1E293B]">
            <div class="text-lg font-extrabold text-white">TRADE<span class="text-[#00E676]">IQ</span> <span class="text-xs text-[#F5B700]">CRYPTO PRO</span></div>
            <button id="menu-close" class="w-8 h-8 rounded-lg bg-[#141B2D] text-slate-300">✕</button>
          </div>
          <nav id="drawer-nav" class="mt-4 space-y-1.5"></nav>
        </div>
        <div class="pt-4 border-t border-[#1E293B] space-y-2">
          <div class="flex justify-between text-xs px-2"><span class="text-slate-400">Supabase</span><span class="text-[#00E676] font-bold">PROTECTED</span></div>
          <button id="logout-btn" class="w-full py-2 rounded-xl bg-[#141B2D] border border-[#263449] text-xs font-bold text-slate-300">Lock / Sign Out</button>
        </div>
      </aside>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 z-50 hidden max-w-xs bg-[#141B2D] border border-[#00E676]/45 text-white px-4 py-3 rounded-xl shadow-2xl text-xs font-semibold"></div>
    <main id="content" class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-5 py-4 space-y-4"></main>
  </div>

  <script>
    const TOKEN_KEY = 'tradeiq.crypto.session';
    let authToken = sessionStorage.getItem(TOKEN_KEY) || null;
    let currMode = localStorage.getItem('tradeiq.crypto.curr') || 'INR'; // Default FULL INR!
    let section = 'desk';
    let horizon = 'intraday';
    let labFilter = 'ALL';
    let chartSym = 'BTCUSDT';
    let chartTf = '1m';
    let chartDir = 'LONG';
    window.setChartDir = (d) => { chartDir = d; loadChart(true); };
    let marketSearch = '';
    let marketSort = 'volume';
    let overview = null;
    let spotData = null;
    let brainData = null;
    let marketsData = null;
    let boomData = [];
    let catalystData = [];
    let connData = null;
    let tvChart = null;
    let candleSeriesRef = null;
    let volSeriesRef = null;
    let okxPublicWs = null;
    let okxCandleWs = null;
    let okxPingTimer = null;
    let okxReconnectTimer = null;
    let lastBarRef = null;
    let liveFpBuy = 0;
    let liveFpSell = 0;
    let lastLivePx = 0;
    let chartStreamActive = false;
    let ws = null;

    function inrRate() {
      return Number(overview?.usdt_inr || spotData?.usdt_inr || 85.20) || 85.20;
    }

    // Format money amounts (Equity, P&L, Budget, Margin) in INR (default) or USD
    function fmtAmt(usdVal, signed = false) {
      const u = Number(usdVal || 0);
      const sign = signed ? (u > 0 ? '+' : (u < 0 ? '-' : '')) : (u < 0 ? '-' : '');
      if (currMode === 'INR') {
        const r = Math.abs(u * inrRate());
        return sign + '₹' + r.toLocaleString('en-IN', { minimumFractionDigits: r < 100 ? 2 : 0, maximumFractionDigits: r < 100 ? 2 : 0 });
      }
      return sign + '$' + Math.abs(u).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Secondary subtle reference line ($ when in INR mode, ₹ when in USD mode)
    function fmtAlt(usdVal, signed = false) {
      const u = Number(usdVal || 0);
      const sign = signed ? (u > 0 ? '+' : (u < 0 ? '-' : '')) : (u < 0 ? '-' : '');
      if (currMode === 'INR') {
        return sign + '$' + Math.abs(u).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return sign + '₹' + Math.abs(u * inrRate()).toLocaleString('en-IN', { maximumFractionDigits: 0 });
    }

    // Format coin prices (BTC ₹54,88,210 or PEPE ₹0.00124) cleanly in INR (default) or USD
    function fmtPx(usdPx) {
      const u = Number(usdPx || 0);
      if (!Number.isFinite(u) || u === 0) return currMode === 'INR' ? '₹0' : '$0';
      if (currMode === 'INR') {
        const r = u * inrRate();
        if (r >= 1000) return '₹' + r.toLocaleString('en-IN', { maximumFractionDigits: 0 });
        if (r >= 10) return '₹' + r.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        if (r >= 0.1) return '₹' + r.toFixed(3);
        return '₹' + r.toFixed(5);
      }
      if (u >= 100) return '$' + u.toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (u >= 1) return '$' + u.toFixed(3);
      return '$' + u.toFixed(5);
    }

    function fmtVol(v) {
      const n = Number(v || 0);
      if (currMode === 'INR') {
        const cr = (n * inrRate()) / 1e7;
        if (cr >= 100) return '₹' + cr.toFixed(0) + ' Cr';
        return '₹' + cr.toFixed(1) + ' Cr';
      }
      if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
      if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
      return '$' + n.toFixed(0);
    }

    window.toggleCurrency = () => {
      currMode = currMode === 'INR' ? 'USD' : 'INR';
      localStorage.setItem('tradeiq.crypto.curr', currMode);
      const b = document.getElementById('curr-btn');
      if (b) b.textContent = currMode === 'INR' ? '₹ INR' : '$ USD';
      showToast(`Display switched to ${currMode === 'INR' ? '₹ Indian Rupee (INR)' : '$ US Dollar (USD)'}`);
      render();
      if (section === 'chart') loadChart(true);
    };

    function closeExchangeChartSockets() {
      chartStreamActive = false;
      if (okxPingTimer) { clearInterval(okxPingTimer); okxPingTimer = null; }
      if (okxReconnectTimer) { clearTimeout(okxReconnectTimer); okxReconnectTimer = null; }
      try { if (okxPublicWs) { okxPublicWs.onclose = null; okxPublicWs.close(); } } catch {}
      try { if (okxCandleWs) { okxCandleWs.onclose = null; okxCandleWs.close(); } } catch {}
      okxPublicWs = null;
      okxCandleWs = null;
    }

    function connectOkxDirectMsStream(sym, tf) {
      closeExchangeChartSockets();
      chartStreamActive = true;
      const instId = sym.endsWith('USDT') ? sym.slice(0, -4) + '-USDT-SWAP' : sym;
      const okxBar = { '1m':'candle1m', '5m':'candle5m', '15m':'candle15m', '1h':'candle1H', '4h':'candle4H', '1d':'candle1D' }[tf] || 'candle1m';
      const mult = currMode === 'INR' ? inrRate() : 1;
      liveFpBuy = 0;
      liveFpSell = 0;

      const scheduleReconnect = () => {
        if (!chartStreamActive || section !== 'chart') return;
        if (okxReconnectTimer) return;
        okxReconnectTimer = setTimeout(() => {
          okxReconnectTimer = null;
          if (chartStreamActive && section === 'chart') connectOkxDirectMsStream(sym, tf);
        }, 1200);
      };

      try {
        okxPublicWs = new WebSocket('wss://ws.okx.com:8443/ws/v5/public');
        okxPublicWs.onopen = () => {
          okxPublicWs.send(JSON.stringify({
            op: 'subscribe',
            args: [
              { channel: 'tickers', instId },
              { channel: 'books5', instId },
              { channel: 'trades', instId }
            ]
          }));
        };
        okxPublicWs.onclose = scheduleReconnect;
        okxPublicWs.onerror = () => { try { okxPublicWs.close(); } catch {} };
        okxPublicWs.onmessage = (ev) => {
          if (ev.data === 'pong') return;
          try {
            const msg = JSON.parse(ev.data);
            const ch = msg?.arg?.channel;
            const d = msg?.data?.[0];
            if (!d) return;

            if (ch === 'tickers') {
              const pxUsd = Number(d.last);
              const pxDisp = pxUsd * mult;
              const op24 = Number(d.open24h || pxUsd);
              const pct = op24 > 0 ? (((pxUsd - op24) / op24) * 100) : 0;
              const ltpEl = document.getElementById('ch-ltp');
              const chgEl = document.getElementById('ch-chg');
              if (ltpEl) {
                ltpEl.textContent = fmtPx(pxUsd);
                ltpEl.style.color = pxUsd >= lastLivePx ? '#00E676' : '#FF3B5C';
                lastLivePx = pxUsd;
              }
              if (chgEl) {
                chgEl.textContent = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
                chgEl.style.color = pct >= 0 ? '#00E676' : '#FF3B5C';
              }
              if (candleSeriesRef && lastBarRef && Number.isFinite(pxDisp) && pxDisp > 0) {
                lastBarRef.close = pxDisp;
                if (pxDisp > lastBarRef.high) lastBarRef.high = pxDisp;
                if (pxDisp < lastBarRef.low) lastBarRef.low = pxDisp;
                candleSeriesRef.update(lastBarRef);
              }
            } else if (ch === 'books5') {
              const bids = d.bids || [];
              const asks = d.asks || [];
              const bq = bids.reduce((a, x) => a + Number(x[1] || 0), 0);
              const aq = asks.reduce((a, x) => a + Number(x[1] || 0), 0);
              const bp = (bq + aq) > 0 ? ((bq / (bq + aq)) * 100).toFixed(1) : '50.0';
              const pres = Number(bp) >= 58 ? 'BUY_IMBALANCE' : (Number(bp) <= 42 ? 'SELL_IMBALANCE' : 'BALANCED');
              const obBox = document.getElementById('ob-box');
              if (obBox) {
                obBox.innerHTML = `<div class="flex justify-between mb-2"><span class="text-sm font-extrabold text-white">Live Millisecond 5-Level Orderbook (${currMode})</span><span class="text-xs font-bold ${Number(bp)>=50?'text-[#00E676]':'text-[#FF3B5C]'}">${pres} (${bp}% Buy)</span></div>
                  <div class="grid grid-cols-2 gap-3 text-xs mono">
                    <div class="space-y-1">${bids.slice(0,5).map(b => `<div class="flex justify-between px-2 py-1 rounded bg-[#00E676]/10"><span class="text-[#00E676]">${fmtPx(b[0])}</span><span>${b[1]}</span></div>`).join('')}</div>
                    <div class="space-y-1">${asks.slice(0,5).map(a => `<div class="flex justify-between px-2 py-1 rounded bg-[#FF3B5C]/10"><span class="text-[#FF3B5C]">${fmtPx(a[0])}</span><span>${a[1]}</span></div>`).join('')}</div>
                  </div>`;
              }
            } else if (ch === 'trades') {
              for (const tr of (msg.data || [])) {
                const val = Number(tr.sz || 0) * Number(tr.px || 0);
                if (tr.side === 'buy') liveFpBuy += val;
                else liveFpSell += val;
              }
              if ((liveFpBuy + liveFpSell) > 5000000) { liveFpBuy *= 0.5; liveFpSell *= 0.5; }
              const tot = liveFpBuy + liveFpSell;
              if (tot > 0) {
                const dp = (((liveFpBuy - liveFpSell) / tot) * 100).toFixed(1);
                const bias = Number(dp) >= 10 ? 'BUY_ABSORPTION' : (Number(dp) <= -10 ? 'SELL_ABSORPTION' : 'NEUTRAL');
                const hudEl = document.getElementById('tv-chart-hud');
      if (hudEl && r.chart_read) {
        const cr = r.chart_read, pm = cr.price_map || {};
        hudEl.innerHTML = `<span class="px-2 py-0.5 rounded bg-[#070B12]/90 border ${cr.passed?'border-[#00E676]/60 text-[#00E676]':'border-[#FF3B5C]/60 text-[#FF3B5C]'} font-extrabold">${cr.passed?'✅ TAKE':'🚫 SKIP'} ${cr.points_passed}/12</span>`
          + `<span class="px-2 py-0.5 rounded bg-[#070B12]/90 border border-[#F5B700]/50 text-[#F5B700]">POC ${fmtPx(pm.poc||0)}</span>`
          + `<span class="px-2 py-0.5 rounded bg-[#070B12]/90 border border-[#00E676]/40 text-[#6EE7B7]">BidW ${fmtPx(pm.big_bid_wall_px||0)}</span>`
          + `<span class="px-2 py-0.5 rounded bg-[#070B12]/90 border border-[#FF3B5C]/40 text-[#FDA4AF]">AskW ${fmtPx(pm.big_ask_wall_px||0)}</span>`
          + `<span class="px-2 py-0.5 rounded bg-[#070B12]/90 border border-[#00D4FF]/40 text-[#00D4FF]">${pm.bos_choch||''} • ${pm.room_to_obstacle_rr||0}R</span>`;
      }
      const crBox = document.getElementById('cr12-box');
      if (crBox && r.chart_read) {
        const cr = r.chart_read, pm = cr.price_map || {}, cv = r.coin_verification || {};
        const pts = cr.points_detail || [];
        const rejs = cr.reject_reasons || [];
        crBox.innerHTML = `
          <div class="flex flex-wrap justify-between items-center gap-2 mb-3">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-sm font-extrabold text-white">🧭 Live 12-Point Pro Chart Reader X-Ray</span>
                <span class="text-[10px] mono font-bold px-2 py-0.5 rounded ${cv.verified?'bg-[#00E676]/15 text-[#00E676]':'bg-[#FF3B5C]/20 text-[#FF3B5C]'}">${cv.verified?'✓ '+cv.category:'🚫 GATE 1 BLOCKED'}</span>
              </div>
              <div class="text-[11px] text-slate-400 mt-0.5">বট ঠিক এখন এই চার্টের ১২টা পয়েন্ট কীভাবে পড়ছে (উপরের চার্টে POC, Bid/Ask ওয়াল, SL ও Target লাইন আঁকা আছে)</div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="setChartDir('LONG')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${chartDir==='LONG'?'bg-[#00E676] text-[#04120B] border-[#00E676]':'bg-[#141B2D] text-slate-300 border-[#263449]'}">LONG Read</button>
              <button onclick="setChartDir('SHORT')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${chartDir==='SHORT'?'bg-[#FF3B5C] text-white border-[#FF3B5C]':'bg-[#141B2D] text-slate-300 border-[#263449]'}">SHORT Read</button>
              <span class="text-xs mono font-extrabold px-2.5 py-1 rounded-lg ${cr.passed?'bg-[#00E676]/20 text-[#00E676]':'bg-[#FF3B5C]/20 text-[#FF3B5C]'}">${cr.passed?'✅ TAKE ('+cr.points_passed+'/12)':'🚫 SKIP ('+cr.points_passed+'/12)'}</span>
            </div>
          </div>
          ${rejs.length ? `<div class="mb-3 p-2.5 rounded-xl bg-[#FF3B5C]/12 border border-[#FF3B5C]/40 text-xs text-[#FDA4AF]"><strong>🚫 কেন বট এখন এটা ছাড়ছে (Reject Reasons):</strong> ${rejs.join(' • ')}</div>` : `<div class="mb-3 p-2.5 rounded-xl bg-[#00E676]/12 border border-[#00E676]/40 text-xs text-[#6EE7B7]"><strong>✅ সব হার্ড গেট পাস!</strong> বট এই সেটআপটিকে <strong>${cr.direction}</strong> এন্ট্রির জন্য যোগ্য বলছে (Room-to-Obstacle: <strong>${cr.room_to_obstacle_rr}R</strong>)।</div>`}
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-xs mono mb-3">
            <div class="p-2 rounded-xl bg-[#090D16] border border-[#1B2436]"><div class="text-[10px] text-slate-400">Entry (Closed)</div><div class="font-bold text-white">${fmtPx(pm.entry||r.ltp)}</div></div>
            <div class="p-2 rounded-xl bg-[#090D16] border border-[#FF3B5C]/30"><div class="text-[10px] text-[#FDA4AF]">Structural SL</div><div class="font-bold text-[#FF3B5C]">${fmtPx(pm.structural_sl||0)}</div></div>
            <div class="p-2 rounded-xl bg-[#090D16] border border-[#00E676]/30"><div class="text-[10px] text-[#6EE7B7]">Target TP</div><div class="font-bold text-[#00E676]">${fmtPx(pm.structural_tp||0)}</div></div>
            <div class="p-2 rounded-xl bg-[#090D16] border border-[#1B2436]"><div class="text-[10px] text-slate-400">Buyer / Seller Wall</div><div class="font-bold text-[#00D4FF]">${fmtPx(pm.big_bid_wall_px||0)} / ${fmtPx(pm.big_ask_wall_px||0)}</div></div>
            <div class="p-2 rounded-xl bg-[#090D16] border border-[#1B2436]"><div class="text-[10px] text-slate-400">POC / SMC Zone</div><div class="font-bold text-[#F5B700]">${fmtPx(pm.poc||0)} • ${pm.smc_zone||'EQ'}</div></div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
            ${pts.map(pt => `<div class="p-2 rounded-xl bg-[#090D16] border ${pt.ok?'border-[#00E676]/30':'border-[#FF3B5C]/35'} flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="text-[11px] font-bold text-white truncate">P${pt.point}. ${pt.name}</div>
                <div class="text-[10px] text-slate-400 truncate mt-0.5">${pt.detail}</div>
              </div>
              <span class="text-[10px] mono font-extrabold px-1.5 py-0.5 rounded shrink-0 ${pt.ok?'bg-[#00E676]/20 text-[#00E676]':'bg-[#FF3B5C]/20 text-[#FF3B5C]'}">${pt.ok?'✓ PASS':'✗ FAIL'}</span>
            </div>`).join('')}
          </div>`;
      }
      const fpBox = document.getElementById('fp-box');
                if (fpBox) {
                  fpBox.innerHTML = `<div class="flex items-center justify-between flex-wrap gap-2">
                    <div><div class="text-sm font-extrabold text-white">Live Millisecond Tick Footprint &amp; CVD (${sym})</div>
                    <div class="text-[11px] text-slate-400">Direct OKX exchange tick stream • Keep-Alive Ping ON ⚡</div></div>
                    <span class="text-xs font-extrabold mono px-2.5 py-1 rounded-lg ${Number(dp)>=0?'bg-[#00E676]/15 text-[#00E676]':'bg-[#FF3B5C]/15 text-[#FF3B5C]'}">${bias} (${Number(dp)>=0?'+':''}${dp}%)</span>
                  </div>`;
                }
              }
            }
          } catch {}
        };
      } catch {}

      try {
        okxCandleWs = new WebSocket('wss://ws.okx.com:8443/ws/v5/business');
        okxCandleWs.onopen = () => {
          okxCandleWs.send(JSON.stringify({ op: 'subscribe', args: [{ channel: okxBar, instId }] }));
        };
        okxCandleWs.onclose = scheduleReconnect;
        okxCandleWs.onerror = () => { try { okxCandleWs.close(); } catch {} };
        okxCandleWs.onmessage = (ev) => {
          if (ev.data === 'pong') return;
          try {
            const msg = JSON.parse(ev.data);
            const row = msg?.data?.[0];
            if (!row || !candleSeriesRef || !volSeriesRef) return;
            const ts = Math.floor(Number(row[0]) / 1000);
            const o = Number(row[1]) * mult, h = Number(row[2]) * mult, l = Number(row[3]) * mult, cl = Number(row[4]) * mult, v = Number(row[5]);
            lastBarRef = { time: ts, open: o, high: h, low: l, close: cl };
            candleSeriesRef.update(lastBarRef);
            volSeriesRef.update({ time: ts, value: v, color: cl >= o ? 'rgba(0,230,118,0.32)' : 'rgba(255,59,92,0.32)' });
          } catch {}
        };
      } catch {}

      okxPingTimer = setInterval(() => {
        try { if (okxPublicWs && okxPublicWs.readyState === 1) okxPublicWs.send('ping'); } catch {}
        try { if (okxCandleWs && okxCandleWs.readyState === 1) okxCandleWs.send('ping'); } catch {}
      }, 18000);
    }

            let best = cData[0].time, bestDiff = Math.abs(cData[0].time - targetSec);
            for (const bar of cData) {
              const diff = Math.abs(bar.time - targetSec);
              if (diff < bestDiff) { best = bar.time; bestDiff = diff; }
            }
            // Only plot if within chart time window (+2 bar buffer)
            const stepSec = cData.length >= 2 ? Math.abs(cData[1].time - cData[0].time) : 900;
            if (targetSec < cData[0].time - stepSec * 2 || targetSec > cData[cData.length - 1].time + stepSec * 2) return null;

    async function refreshCore() {
      overview = await apiFetch('/api/v1/crypto/overview');
      if (section === 'spot') spotData = await apiFetch('/api/v1/spot/overview');
      render();
    }

    function connectWs() {
      if (!authToken) return;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}/api/v1/ws/live?token=${encodeURIComponent(authToken)}`);
      ws.onmessage = (ev) => {
        try {
          const m = JSON.parse(ev.data);
          if (m.type === 'LIVE_TICK' && overview) {
            overview.majors = m.majors; overview.ledger = m.ledger; overview.usdt_inr = m.usdt_inr;
            if (m.brain) overview.brain = m.brain;
            if (m.spot_summary) overview.spot_summary = m.spot_summary;
            if (m.strategy_config) overview.strategy_config = m.strategy_config;
            renderMajors();
            renderBrainSticky();
            if (section === 'desk') render();
          }
        } catch {}
      };
      ws.onclose = () => { setTimeout(connectWs, 3000); };
    }

    async function bootApp() {
      document.getElementById('login-view').hidden = true;
      document.getElementById('app-view').hidden = false;
      await refreshCore();
      connectWs();
      setInterval(refreshCore, 30000);
    }

      const r = await apiFetch('/api/v1/crypto/scan', { method: 'POST', body: JSON.stringify({ execute_entries: true }) });
      showToast(`Screened ${r.market_universe_screened || 534} coins • ${r.opened_count} opened`);
      await refreshCore();
    });

    if (authToken) bootApp();
  </script>
</body>
</html>
