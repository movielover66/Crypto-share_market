<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কয়েন বিশ্লেষণ · শেখো</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0b101b; --card:#121a2b; --line:#1f2a40; --txt:#e6ebf5; --mute:#8b97b0; --green:#22c55e; --red:#ef4444; --blue:#38bdf8; --amber:#f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, "Noto Sans Bengali", "Segoe UI", sans-serif; -webkit-text-size-adjust:100%; }
  body { padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px)); }
  header { position:sticky; top:0; z-index:20; background:rgba(11,16,27,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; display:flex; align-items:center; gap:10px; }
  header a { color:var(--blue); text-decoration:none; font-size:14px; }
  header h1 { font-size:16px; margin:0; flex:1; }
  .toggle { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:5px 10px; background:var(--card); color:var(--txt); }
  main { max-width:760px; margin:0 auto; padding:10px 12px; }
  .row { display:flex; gap:8px; align-items:center; }
  input#sym { flex:1; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:10px 12px; font-size:16px; text-transform:uppercase; min-width:0; }
  button { font:inherit; }
  .btn { background:var(--blue); color:#04202e; border:0; border-radius:10px; padding:10px 14px; font-weight:600; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0; scrollbar-width:none; }
  .chip { flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:999px; padding:6px 12px; font-size:13px; }
  .chip.on { border-color:var(--blue); color:var(--blue); }
  .chip small { color:var(--mute); margin-left:4px; }
  .tfs { display:flex; gap:6px; margin:2px 0 8px; }
  .tf { flex:1; background:var(--card); border:1px solid var(--line); color:var(--mute); border-radius:8px; padding:8px 0; font-size:13px; }
  .tf.on { color:#04202e; background:var(--blue); border-color:var(--blue); font-weight:600; }
  #chartbox { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #chart { width:100%; height:340px; }
  .legend { font-size:12px; color:var(--mute); padding:8px 10px; display:flex; flex-wrap:wrap; gap:4px 12px; border-top:1px solid var(--line); }
  .dot { display:inline-block; width:10px; height:3px; margin-right:4px; vertical-align:middle; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:10px; }
  .card h2 { font-size:14px; margin:0 0 8px; color:var(--mute); font-weight:600; letter-spacing:.2px; }
  .big { font-size:20px; font-weight:700; }
  .sub { color:var(--mute); font-size:12px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); margin-left:6px; vertical-align:middle; }
  .b-up { color:var(--green); border-color:rgba(34,197,94,.4); background:rgba(34,197,94,.1); }
  .b-down { color:var(--red); border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.1); }
  .b-neutral { color:var(--amber); border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.1); }
  ul { margin:8px 0 0; padding-left:18px; } li { margin:5px 0; font-size:14px; line-height:1.45; }
  .box { background:rgba(56,189,248,.08); border:1px solid rgba(56,189,248,.25); border-radius:10px; padding:10px; margin-top:10px; font-size:14px; line-height:1.5; }
  .warn { background:rgba(245,158,11,.08); border-color:rgba(245,158,11,.3); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .kv { background:#0e1525; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .kv b { display:block; font-size:15px; margin-top:2px; }
  .kv span { font-size:12px; color:var(--mute); }
  .lvl { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .lvl:last-child { border-bottom:0; }
  .lvl .l { display:flex; align-items:center; gap:8px; }
  .sw { width:10px; height:10px; border-radius:50%; }
  .term { border-bottom:1px dotted var(--blue); color:var(--blue); cursor:pointer; }
  .check { display:flex; gap:8px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .check:last-child { border-bottom:0; }
  .check .s { color:var(--mute); font-size:12px; }
  .pts { margin-left:auto; font-weight:600; white-space:nowrap; }
  .candle { display:flex; gap:12px; align-items:center; }
  .pat { border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
  .pro-only { display:none; } body.pro .pro-only { display:block; }
  body.pro .grid.pro-only { display:grid; }
  #msg { padding:14px; color:var(--mute); font-size:14px; }
  #sheet { position:fixed; left:0; right:0; bottom:0; background:#0f1730; border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateY(110%); transition:transform .2s; z-index:50; max-height:60vh; overflow:auto; }
  #sheet.open { transform:translateY(0); }
  #sheet h3 { margin:0 0 6px; font-size:16px; } #sheet p { margin:6px 0; font-size:14px; line-height:1.55; }
  .foot { color:var(--mute); font-size:12px; text-align:center; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <a href="/">← হোম</a>
  <h1>কয়েন বিশ্লেষণ</h1>
  <button class="toggle" id="modeBtn">সরল মোড</button>
</header>
<main>
  <div class="row">
    <input id="sym" placeholder="কয়েন (BTC, ETH, SOL...)" autocomplete="off" autocapitalize="characters">
    <button class="btn" id="go">দেখো</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tfs" id="tfs">
    <button class="tf" data-tf="15m">15m</button>
    <button class="tf" data-tf="1h">1h</button>
    <button class="tf on" data-tf="4h">4h</button>
    <button class="tf" data-tf="1d">1d</button>
  </div>

  <div id="chartbox">
    <div id="chart"></div>
    <div class="legend" id="legend">
      <span><i class="dot" style="background:#38bdf8"></i>Entry</span>
      <span><i class="dot" style="background:#ef4444"></i>Stop-loss</span>
      <span><i class="dot" style="background:#22c55e"></i>Target</span>
      <span><i class="dot" style="background:#94a3b8"></i>Support/Resistance</span>
      <span><i class="dot" style="background:#f59e0b"></i>EMA20</span>
      <span><i class="dot" style="background:#a78bfa"></i>EMA50</span>
    </div>
  </div>
  <div id="msg">লোড হচ্ছে...</div>
  <div id="cards"></div>
  <div class="foot">শুধু শেখা ও paper trade-এর জন্য। এটা আর্থিক পরামর্শ নয়। কোনো সংকেত লাভের নিশ্চয়তা দেয় না।<br>চার্টের সময় IST (ভারতীয় সময়)।</div>
</main>
<div id="sheet"></div>

<script>
const IST = 19800;
const GLOSS = {
  "EMA": ["EMA (Exponential Moving Average)", "সাম্প্রতিক দামকে বেশি গুরুত্ব দিয়ে বানানো গড় দাম। EMA20 = গত ২০ ক্যান্ডেলের গড়, EMA50 = ৫০ ক্যান্ডেলের। দাম গড়ের ওপরে থাকলে সাধারণত বাজার শক্তিশালী।"],
  "ADX": ["ADX (Trend Strength)", "ট্রেন্ড কতটা জোরালো তা মাপে, দিক নয়। ২০-এর নিচে = দুর্বল/রেঞ্জ, ২০–২৮ = মাঝারি, ২৮+ = শক্তিশালী। উপমা: গাড়ির গতি, কোন দিকে যাচ্ছে সেটা নয়।"],
  "ATR": ["ATR (Average True Range)", "একটা ক্যান্ডেলে দাম গড়ে কতটা ওঠানামা করে। যে কয়েন বেশি দোলে তার Stop-loss বেশি দূরে রাখতে হয়, না হলে সামান্য দোলাতেই বেরিয়ে যাবে।"],
  "RSI": ["RSI", "০–১০০ স্কেলে দাম কতটা 'গরম' বা 'ঠান্ডা'। ৭০–৮০+ = অতি গরম (দামি হয়ে গেছে), ৩০-এর নিচে = অতি ঠান্ডা (সস্তা/ভয়ের বাজার)।"],
  "RVOL": ["RVOL (Relative Volume)", "এখনকার লেনদেন গত ২০ ক্যান্ডেলের গড়ের কত গুণ। ১.২৫+ মানে সাধারণের চেয়ে বেশি আগ্রহ। ব্রেকআউটে ভলিউম না থাকলে সেটা ভুয়া হতে পারে।"],
  "OBV": ["OBV (On-Balance Volume)", "দাম বাড়ার দিনের ভলিউম যোগ, কমার দিনের ভলিউম বিয়োগ করে চলা সংখ্যা। উঠতে থাকলে বড়রা কিনছে বলে ধরা হয়।"],
  "R:R": ["Risk : Reward", "ঝুঁকির তুলনায় সম্ভাব্য লাভ। ১:২ মানে ১০০ টাকা ঝুঁকিতে ২০০ টাকা লাভের সুযোগ। এতে অর্ধেক ট্রেড হারলেও লাভে থাকা যায়।"],
  "SL": ["Stop-loss (SL)", "আগে থেকে ঠিক করা 'এখানে ভুল প্রমাণ হলে বেরিয়ে যাব' দাম। এটাই তোমার সর্বোচ্চ লস আটকায়। SL ছাড়া ট্রেড মানে ব্রেক ছাড়া গাড়ি।"],
  "TP": ["Target (TP)", "যে দামে লাভ তুলে বেরিয়ে যাবে। আগেই ঠিক করা থাকলে লোভে পড়ে সব হারানোর সম্ভাবনা কমে।"],
  "Support": ["Support (সাপোর্ট)", "যে দামের কাছে এসে আগে বারবার দাম থেমেছে বা উঠেছে। নিচের মেঝে ভাবো।"],
  "Resistance": ["Resistance (রেজিস্ট্যান্স)", "যে দামের কাছে এসে আগে বারবার দাম আটকে নেমেছে। ওপরের ছাদ ভাবো। টার্গেটের আগে ছাদ থাকলে লাভ পুরো না-ও হতে পারে।"],
  "Score": ["Swing Score", "৫টা শর্ত মিলিয়ে ০–১০০ নম্বর। ভিত্তি ৩৫, প্রতিটা মেলা শর্তে পয়েন্ট যোগ। ৭০+ হলে বট paper trade নেয়। এটা অনুমানভিত্তিক নিয়ম, গ্যারান্টি নয়। paper trade চালিয়ে প্রমাণ করতে হবে।"],
  "TDS": ["TDS ও ফি", "ভারতে ক্রিপ্টো বিক্রিতে ১% TDS কাটে আর এক্সচেঞ্জ ফি আছে। তাই লাভের হিসাবে প্রায় ১.২% খরচ ধরা হয়েছে, যাতে paper ফল বাস্তবের কাছাকাছি থাকে।"],
  "Candle": ["ক্যান্ডেল কীভাবে পড়বে", "প্রতিটা ক্যান্ডেল একটা সময়ের গল্প: বডি = খোলা ও বন্ধ দামের মাঝে, ছায়া (শিখা) = ওই সময়ে ছোঁয়া সর্বোচ্চ ও সর্বনিম্ন দাম। লম্বা ছায়া মানে দাম ওই দিকে গিয়েছিল কিন্তু ফিরে এসেছে।"]
};
const T = (k, label) => `<span class="term" data-t="${k}">${label || k}</span>`;

const $ = id => document.getElementById(id);
const st = { sym: (new URLSearchParams(location.search).get('symbol') || 'BTC').toUpperCase().replace('USDT',''),
             tf: new URLSearchParams(location.search).get('tf') || '4h', pro: false };
let chart, candleSeries, volSeries, e20Series, e50Series, lines = [];

function fp(x) {
  if (x == null || isNaN(x)) return '--';
  if (x >= 1000) return x.toLocaleString('en-IN', {maximumFractionDigits: 0});
  if (x >= 1) return x.toLocaleString('en-IN', {maximumFractionDigits: 2});
  return Number(x).toPrecision(4);
}
function inr(x, rate) { return rate ? '₹' + fp(x * rate) : ''; }

function initChart() {
  if (!window.LightweightCharts) { $('msg').textContent = 'চার্ট লাইব্রেরি লোড হয়নি (ইন্টারনেট চেক করো)। নিচের কার্ডগুলো কাজ করবে।'; return; }
  chart = LightweightCharts.createChart($('chart'), {
    layout: { background: { color: '#121a2b' }, textColor: '#8b97b0' },
    grid: { vertLines: { color: '#182238' }, horzLines: { color: '#182238' } },
    rightPriceScale: { borderColor: '#1f2a40' },
    timeScale: { borderColor: '#1f2a40', timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 },
    autoSize: true,
  });
  candleSeries = chart.addCandlestickSeries({ upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444' });
  volSeries = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: '' });
  volSeries.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  e20Series = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
  e50Series = chart.addLineSeries({ color: '#a78bfa', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
}

function drawChart(d) {
  if (!chart) return;
  const sh = t => t + IST;
  candleSeries.setData(d.candles.map(c => ({ time: sh(c.time), open: c.open, high: c.high, low: c.low, close: c.close })));
  volSeries.setData(d.candles.map(c => ({ time: sh(c.time), value: c.volume, color: c.close >= c.open ? 'rgba(34,197,94,.35)' : 'rgba(239,68,68,.35)' })));
  e20Series.setData(d.ema20.map(p => ({ time: sh(p.time), value: p.value })));
  e50Series.setData(d.ema50.map(p => ({ time: sh(p.time), value: p.value })));
  candleSeries.setMarkers(d.markers.map(m => ({
    time: sh(m.time),
    position: m.bias === 'bullish' ? 'belowBar' : 'aboveBar',
    color: m.bias === 'bullish' ? '#22c55e' : (m.bias === 'bearish' ? '#ef4444' : '#94a3b8'),
    shape: m.bias === 'bullish' ? 'arrowUp' : (m.bias === 'bearish' ? 'arrowDown' : 'circle'),
    text: m.name
  })).sort((a, b) => a.time - b.time));
  lines.forEach(l => candleSeries.removePriceLine(l)); lines = [];
  const add = (price, color, title, style) => lines.push(candleSeries.createPriceLine({ price, color, lineWidth: style === 'solid' ? 2 : 1, lineStyle: style === 'solid' ? 0 : 2, axisLabelVisible: true, title }));
  if (d.plan) {
    add(d.plan.entry, '#38bdf8', 'Entry', 'solid');
    add(d.plan.sl, '#ef4444', 'SL', 'solid');
    add(d.plan.tp, '#22c55e', 'Target', 'solid');
  }
  (d.levels.resistance || []).forEach(p => add(p, '#94a3b8', 'Resistance', 'dash'));
  (d.levels.support || []).forEach(p => add(p, '#94a3b8', 'Support', 'dash'));
  const n = d.candles.length;
  chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 90), to: n + 6 });
}

function candleSvg(s) {
  const hi = s.high, lo = s.low, r = (hi - lo) || 1;
  const y = p => 5 + (hi - p) / r * 80;
  const top = y(Math.max(s.open, s.close)), bot = y(Math.min(s.open, s.close));
  const col = s.color === 'green' ? '#22c55e' : '#ef4444';
  return `<svg width="44" height="90" viewBox="0 0 44 90"><line x1="22" x2="22" y1="5" y2="85" stroke="${col}" stroke-width="2"/><rect x="10" width="24" y="${top}" height="${Math.max(2, bot - top)}" fill="${col}"/></svg>`;
}

function biasBadge(b) {
  const m = { bullish: ['b-up', 'বুলিশ (ওপরের ইঙ্গিত)'], bearish: ['b-down', 'বেয়ারিশ (নিচের ইঙ্গিত)'], neutral: ['b-neutral', 'নিরপেক্ষ'] }[b];
  return `<span class="badge ${m[0]}">${m[1]}</span>`;
}

function render(d) {
  const t = d.trend, c = d.candle, p = d.plan, rate = d.inr_rate;
  const tCls = t.key.startsWith('up') || t.key === 'reversal_up' ? 'b-up' : (t.key.startsWith('down') ? 'b-down' : 'b-neutral');
  let h = '';

  h += `<div class="card"><div class="big">${d.symbol}<span class="sub"> / USDT</span> &nbsp;${fp(d.price)}</div>
        <div class="sub">${rate ? '≈ ₹' + fp(d.price * rate) + ' · ' : ''}টাইমফ্রেম ${d.tf}</div></div>`;

  h += `<div class="card"><h2>১. এখন কী ট্রেন্ড চলছে?</h2>
        <div class="big">${t.name_bn}<span class="badge ${tCls}">${t.name}</span></div>
        <ul>${t.reasons.map(r => `<li>${r}</li>`).join('')}</ul>
        <div class="box"><b>মানে কী:</b> ${t.meaning}</div>
        <div class="sub" style="margin-top:8px">শব্দ বুঝতে ট্যাপ করো: ${T('EMA')} · ${T('ADX')}</div></div>`;

  const sh = c.shape;
  h += `<div class="card"><h2>২. সর্বশেষ ক্যান্ডেল কী বলছে?</h2><div class="candle">${candleSvg(sh)}
        <div><div class="sub">${sh.color === 'green' ? 'সবুজ (দাম বেড়েছে)' : 'লাল (দাম কমেছে)'}</div>
        <div style="font-size:14px;margin-top:4px">বডি ${sh.body_pct}% · ওপরের ছায়া ${sh.upper_pct}% · নিচের ছায়া ${sh.lower_pct}%</div>
        <div class="sub" style="margin-top:4px">${T('Candle', 'ক্যান্ডেল কীভাবে পড়ে?')}</div></div></div>`;
  if (c.latest.length) {
    c.latest.forEach(x => {
      h += `<div class="pat"><div class="big" style="font-size:17px">${x.name_bn} <span class="sub">(${x.name})</span>${biasBadge(x.bias)}</div>
            <p style="margin:6px 0;font-size:14px;line-height:1.5">${x.meaning}</p>
            <div class="sub">কনফার্মেশন: ${x.confirm}</div></div>`;
    });
  } else {
    h += `<div class="pat"><div style="font-size:14px;line-height:1.5">এই ক্যান্ডেলে নামওয়ালা কোনো বিশেষ প্যাটার্ন নেই। এটা স্বাভাবিক, বেশিরভাগ ক্যান্ডেলই সাধারণ।</div></div>`;
  }
  if (c.previous.length) {
    h += `<div class="pat sub">আগের ক্যান্ডেলে: ${c.previous.map(x => x.name_bn + ' (' + x.name + ')').join(', ')}</div>`;
  }
  h += `<div class="box warn">${c.disclaimer}</div></div>`;

  if (p) {
    const ok = p.bot_would_trade;
    h += `<div class="card"><h2>৩. ট্রেড প্ল্যান (${p.basis})</h2>
      <div class="box ${ok ? '' : 'warn'}"><b>${ok ? '✅ বট এই ট্রেড নিত' : '⏸️ বট এখন এই ট্রেড নিত না'}</b> — স্কোর ${p.score}, সিগন্যাল: ${p.signal}</div>
      <div class="lvl"><div class="l"><i class="sw" style="background:#38bdf8"></i>Entry (ঢোকা)</div><div>${fp(p.entry)} <span class="sub">${inr(p.entry, rate)}</span></div></div>
      <div class="lvl"><div class="l"><i class="sw" style="background:#ef4444"></i>${T('SL', 'Stop-loss')} (বেরোনো, ভুল হলে)</div><div>${fp(p.sl)} <span class="sub">−${p.sl_pct}% ${inr(p.sl, rate)}</span></div></div>
      <div class="lvl"><div class="l"><i class="sw" style="background:#22c55e"></i>${T('TP', 'Target')} (লাভ তোলা)</div><div>${fp(p.tp)} <span class="sub">+${p.tp_pct}% ${inr(p.tp, rate)}</span></div></div>
      <div class="grid">
        <div class="kv"><span>${T('R:R', 'Risk:Reward')}</span><b>1 : ${p.rr}</b></div>
        <div class="kv"><span>হোল্ড সময় (আনুমানিক)</span><b>${p.hold_label}</b></div>
        <div class="kv"><span>paper পজিশন সাইজ</span><b>₹${p.size_inr.toLocaleString('en-IN')}</b></div>
        <div class="kv"><span>সর্বোচ্চ লস (ফি/${T('TDS')} সহ)</span><b style="color:var(--red)">−₹${p.max_loss_inr.toLocaleString('en-IN')}</b></div>
        <div class="kv"><span>সম্ভাব্য লাভ (খরচ বাদে)</span><b style="color:var(--green)">+₹${p.max_gain_inr.toLocaleString('en-IN')}</b></div>
        <div class="kv pro-only"><span>${T('ATR')} (৪ঘণ্টা)</span><b>${fp(p.atr)} (${p.atr_pct}%)</b></div>
      </div>
      <div class="box" style="margin-top:10px"><b>SL কেন এখানে?</b> ${p.sl_why}<br><b>Target কেন?</b> ${p.tp_why}</div>
      <div class="sub" style="margin-top:8px">ঝুঁকির নিয়ম: প্রতি ট্রেডে মূলধনের ১% ঝুঁকি, একটা কয়েনে সর্বোচ্চ ২৫% পজিশন।</div></div>`;

    let tot = d.score_base;
    h += `<div class="card"><h2>৪. স্কোর কীভাবে হলো? ${T('Score', '(এটা কী?)')}</h2>
      <div class="check"><div>🔹</div><div>ভিত্তি স্কোর</div><div class="pts">+${d.score_base}</div></div>`;
    d.checklist.forEach(x => {
      if (x.ok) tot += x.points;
      h += `<div class="check"><div>${x.ok ? '✅' : '❌'}</div><div>${x.label}<div class="s">${x.why}</div></div><div class="pts" style="color:${x.ok ? 'var(--green)' : 'var(--mute)'}">${x.ok ? '+' + x.points : '0'}</div></div>`;
    });
    h += `<div class="check"><div>🎯</div><div><b>মোট ≈ ${tot}</b> <span class="s">(বট ≥ ${70} হলে ঢোকে; Falling Knife / অতি গরম হলে ঢোকে না)</span></div><div class="pts">${p.score}</div></div>
      <div class="sub pro-only" style="margin-top:6px">চূড়ান্ত স্কোর (cap/ফিল্টার ধরে): ${p.score}। ${T('RSI')} · ${T('RVOL')} · ${T('OBV')}</div></div>`;
  } else {
    h += `<div class="card"><h2>৩. ট্রেড প্ল্যান</h2><div class="sub">এই কয়েনের যথেষ্ট ইতিহাস নেই (৩১ দিনের কম), তাই প্ল্যান বানানো গেল না।</div></div>`;
  }

  if (d.risks && d.risks.length) {
    h += `<div class="card"><h2>৫. সতর্কতা: কেন ঢুকবে না / কী ঝুঁকি</h2><ul>${d.risks.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
  }

  const lv = d.levels;
  if ((lv.resistance && lv.resistance.length) || (lv.support && lv.support.length)) {
    h += `<div class="card"><h2>৬. গুরুত্বপূর্ণ দামের স্তর (৪ঘণ্টার চার্ট)</h2>`;
    (lv.resistance || []).slice().reverse().forEach(x => h += `<div class="lvl"><div class="l"><i class="sw" style="background:#94a3b8"></i>${T('Resistance', 'রেজিস্ট্যান্স (ছাদ)')}</div><div>${fp(x)} <span class="sub">${inr(x, rate)}</span></div></div>`);
    h += `<div class="lvl"><div class="l"><i class="sw" style="background:#38bdf8"></i>এখনকার দাম</div><div><b>${fp(d.price)}</b></div></div>`;
    (lv.support || []).forEach(x => h += `<div class="lvl"><div class="l"><i class="sw" style="background:#94a3b8"></i>${T('Support', 'সাপোর্ট (মেঝে)')}</div><div>${fp(x)} <span class="sub">${inr(x, rate)}</span></div></div>`);
    h += `</div>`;
  }
  $('cards').innerHTML = h;
}

async function load() {
  $('msg').style.display = 'block'; $('msg').textContent = 'লোড হচ্ছে...';
  document.querySelectorAll('.tf').forEach(b => b.classList.toggle('on', b.dataset.tf === st.tf));
  history.replaceState(null, '', `?symbol=${st.sym}&tf=${st.tf}`);
  try {
    const r = await fetch(`/api/analysis/${encodeURIComponent(st.sym)}?tf=${st.tf}`);
    if (!r.ok) { let e = {}; try { e = await r.json(); } catch (_) {} throw new Error(e.detail || ('Error ' + r.status)); }
    const d = await r.json();
    $('msg').style.display = 'none';
    drawChart(d); render(d);
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.s === st.sym));
  } catch (e) {
    $('cards').innerHTML = '';
    $('msg').style.display = 'block';
    $('msg').textContent = 'ডেটা আনা যায়নি: ' + e.message;
  }
}

async function loadChips() {
  let list = [['BTC', ''], ['ETH', ''], ['SOL', '']];
  try {
    const r = await fetch('/api/scanner?limit=12');
    if (r.ok) { const j = await r.json(); if (j.coins && j.coins.length) list = j.coins.slice(0, 12).map(c => [c.symbol, c.swing_score]); }
  } catch (_) {}
  $('chips').innerHTML = list.map(([s, sc]) => `<button class="chip" data-s="${s}">${s}${sc !== '' ? '<small>' + sc + '</small>' : ''}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.s === st.sym));
}

document.addEventListener('click', e => {
  const term = e.target.closest('.term');
  const sheet = $('sheet');
  if (term) {
    const g = GLOSS[term.dataset.t];
    if (g) { sheet.innerHTML = `<h3>${g[0]}</h3><p>${g[1]}</p><p class="sub">বন্ধ করতে যেকোনো জায়গায় ট্যাপ করো</p>`; sheet.classList.add('open'); }
    e.stopPropagation(); return;
  }
  sheet.classList.remove('open');
  const chip = e.target.closest('.chip');
  if (chip) { st.sym = chip.dataset.s; $('sym').value = st.sym; load(); }
  const tf = e.target.closest('.tf');
  if (tf) { st.tf = tf.dataset.tf; load(); }
});
$('go').onclick = () => { const v = $('sym').value.trim().toUpperCase().replace('USDT', ''); if (v) { st.sym = v; load(); } };
$('sym').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('modeBtn').onclick = () => { st.pro = !st.pro; document.body.classList.toggle('pro', st.pro); $('modeBtn').textContent = st.pro ? 'প্রো মোড' : 'সরল মোড'; };

$('sym').value = st.sym;
initChart(); loadChips(); load();
</script>
</body>
</html>
