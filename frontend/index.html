<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1424">
<title>ApexQuant INR</title>
<style>
:root{--bg:#0c1424;--card:#131d33;--line:#22304d;--tx:#e9eefb;--mu:#8b9ab8;--g:#2dd4a0;--r:#ff6b81;--b:#5eb8ff;--m:#8b9ab8;--gold:#f5b942}
@media(prefers-color-scheme:light){:root{--bg:#f3f5fa;--card:#fff;--line:#e2e7f1;--tx:#101a33;--mu:#5b6987;--g:#079669;--r:#dc2650;--b:#0a7ac9;--m:#5b6987;--gold:#a8680a}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Noto Sans Bengali","Hind Siliguri",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
header h1{font-size:20px;font-weight:700;flex:1;letter-spacing:-.3px}
header h1 span{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}.dot.ok{background:var(--g)}
button,.btn{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
.ico{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
h2{font-size:17px;margin:20px 16px 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 16px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.rt{text-align:right}
.mu{color:var(--mu)}.sm{font-size:13px}.up{color:var(--g)}.dn{color:var(--r)}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--gold)}
.ring{--p:0;--c:var(--m);width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring i{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 14px system-ui}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:99px;color:var(--c);border:1px solid var(--c)}
.t-g{--c:var(--g)}.t-r{--c:var(--r)}.t-b{--c:var(--b)}.t-m{--c:var(--m)}
.coin{cursor:pointer}
.det{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);cursor:default;animation:o .18s ease-out}
@keyframes o{from{opacity:0;transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.det{animation:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-bottom:12px}
.grid span{display:block;font-size:12px;color:var(--mu)}
.gap{gap:8px}
.amt{width:96px;font:inherit;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
.btn{padding:10px 16px;border-radius:12px;background:var(--gold);color:#1a1200;font-weight:600;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;padding:6px 16px;overflow-x:auto}
.chips button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.chips button.on{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:600}
summary{cursor:pointer;font-weight:600}details p{margin-top:8px}
.rv{margin:10px 0 12px;padding:10px;border:1px dashed var(--line);border-radius:12px}.rv p{margin-top:5px}.rv a{color:var(--b);margin-right:8px}
.lbl{font-size:13px;color:var(--mu);margin-bottom:8px}
.stat{display:flex;text-align:center}.stat div{flex:1}.stat b{display:block;font-size:22px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:640px}
nav button{flex:1;padding:9px 0 8px;font-size:12px;color:var(--mu)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--gold);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.foot{text-align:center;font-size:12px;color:var(--mu);padding:18px 24px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Apex<span>Quant</span> INR</h1><i class="dot" id="dot"></i><button class="ico" data-act="refresh" aria-label="রিফ্রেশ">↻</button></header>
<main id="app"></main>
<nav><div id="nav">
<button data-tab="home"><b>🏠</b>হোম</button>
<button data-tab="coins"><b>🪙</b>ক্রিপ্টো</button>
<button data-tab="boom"><b>🚀</b>বুম</button>
<button data-tab="stocks"><b>📈</b>শেয়ার</button>
<button data-tab="trades"><b>🧾</b>আমার ট্রেড</button>
</div></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const S={tab:'home',coins:null,news:null,stocks:null,trades:null,boom:null,boomErr:false,sl:null,res:{},rep:{},rb:{},why:{},f:'all',open:null,items:{},err:false,serr:false};
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=v=>'₹'+Number(v).toLocaleString('en-IN',{maximumFractionDigits:v<100?4:2});
const pc=v=>`<b class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v}%</b>`;
const FG={'Extreme Fear':'চরম ভয়',Fear:'ভয়',Neutral:'মাঝামাঝি',Greed:'লোভ','Extreme Greed':'চরম লোভ'};
const BIAS={Bullish:'বাজার ঊর্ধ্বমুখী',Bearish:'বাজার নিম্নমুখী',Neutral:'বাজার নিরপেক্ষ'};
const wait=m=>`<div class="card mu">${m||'লোড হচ্ছে…'}</div>`;
const errc=()=>`<div class="card"><b>ডেটা আনা যায়নি</b><p class="mu sm">সার্ভার সাড়া দেয়নি। ওপরের ↻ চেপে আবার চেষ্টা করো।</p></div>`;
const isWait=s=>/Wait/.test(s);
function verdict(s){
  if(isWait(s))return['এখন নয','r'];
  return({'Confirmed Breakout':['ভালো সেটআপ','g'],'Trend Reversal':['ঘুরে দাঁড়াচ্ছে','g'],'Trend Swing':['ট্রেন্ড ভালো','g'],Accumulation:['জমা হচ্ছে','b']})[s]||['নজরে রাখো','m'];
}
const nc=c=>({k:'C:'+c.symbol,m:'CRYPTO',sym:c.symbol,name:c.name,price:c.price_inr,d1:c.change_24h_pct,d7:c.change_7d_pct,d30:c.change_30d_pct,score:c.swing_score,sig:c.signal,tp:c.target_inr,sl:c.stop_loss_inr,hold:c.hold_label,rsi:c.rsi_4h,adx:c.adx_4h});
const ns=s=>({k:'N:'+s.short_symbol,m:'NSE',sym:s.short_symbol,name:s.name,price:s.price_inr,d1:s.change_24h_pct,d7:s.change_7d_pct,d30:s.change_30d_pct,score:s.swing_score,sig:s.signal,tp:s.target_inr,sl:s.stop_loss_inr,hold:s.hold_label,rsi:s.rsi_14,adx:s.adx_14});
const RV={Pass:['রিসার্চ পাস','g'],Caution:['সতর্ক','b'],Block:['রিসার্চে বাদ','r'],Unknown:['যাচাই হয়নি','m']};
function rbadge(sym){
  const r=S.res[sym]||{},x=r.deep||r.quick;if(!x)return'';
  const[t,c]=RV[x.verdict]||RV.Unknown;
  return`<div style="margin-top:4px"><span class="pill t-${c}">${x.grade?esc(x.grade)+' · ':''}${t}</span></div>`;
}
function rview(r){
  if(!r)return'';
  const[t,c]=RV[r.verdict]||RV.Unknown,f=r.facts||{},b=r.breakdown||{},fu=r.funding||{},tm=r.team||{};
  const m=r.mode==='deep'?'গভীর রিসার্চ':'৭ দিনের চেক';
  const P=a=>(a||[]).map(x=>`<p class="sm">${esc(x)}</p>`).join('');
  const inv=(fu.investors||[]).slice(0,5).join(', ');
  const when=r.ts?new Date(r.ts*1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const facts=[f.rank?'র‍্যাংক #'+f.rank:'',f.age_days!=null?'বয়স '+(f.age_days>=365?(f.age_days/365).toFixed(1)+' বছর':f.age_days+' দিন'):'',f.fdv_mc_ratio?'FDV/মার্কেটক্যাপ '+f.fdv_mc_ratio+'x':'',f.commits_90d!=null?'৯০ দিনে কমিট '+f.commits_90d:'',f.coindcx_inr?'CoinDCX-এ আছে':''].filter(Boolean).join(' · ');
  const src=(r.sources||[]).filter(x=>/^https:\/\//.test(x.url||'')).slice(0,4).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||'সোর্স')}</a>`).join('');
  return`<div class="rv"><div class="row"><b class="grow">${m}</b><span class="pill t-${c}">${r.grade?esc(r.grade)+' · '+esc(r.score??'')+' · ':''}${t}</span></div>
  ${r.summary?`<p class="sm" style="margin-top:6px">${esc(r.summary)}</p>`:''}${P(r.reasons)}
  ${r.mode==='deep'&&r.verdict!=='Unknown'&&'team' in b?`<p class="sm mu">টিম ${b.team}/20 · ফান্ডিং ${b.funding}/20 · টোকেনোমিক্স ${b.tokenomics}/20 · ডেভ ${b.dev}/15 · ট্র্যাকশন ${b.traction}/15 · নারেটিভ ${b.narrative}/10${b.penalty?' · জরিমানা '+b.penalty:''}</p>`:''}
  ${r.verdict!=='Unknown'?`<p class="sm">💰 ${fu.known?'ফান্ডিং: '+(fu.total_usd_m!=null?'$'+esc(fu.total_usd_m)+'M':'অঙ্ক অজানা')+(inv?' · '+esc(inv):''):'ফান্ডিংয়ের তথ্য পাওয়া যায়নি'}</p>
  <p class="sm">👥 ${tm.public===true?'টিম পরিচিত':tm.public===false?'টিম অজ্ঞাত':'টিমের তথ্য অজানা'}${tm.notes?' · '+esc(tm.notes):''}</p>`:''}
  ${(r.news||[]).slice(0,3).map(n=>`<p class="sm mu">📰 ${esc(n.headline)}</p>`).join('')}
  ${facts?`<p class="sm mu">${esc(facts)}</p>`:''}
  ${src?`<p class="sm">${src}</p>`:''}
  <p class="sm mu">${r.cached?'ক্যাশ থেকে · ':''}${when} · AI ভুল করতে পারে, সংখ্যা নিজে মিলিয়ে নিও।</p></div>`;
}
function rpanel(sym){
  const bz=S.rb[sym],has=S.res[sym]&&(S.res[sym].quick||S.res[sym].deep),dis=bz?'disabled':'';
  return`<div><div class="row gap" style="flex-wrap:wrap">
  <button class="btn ghost" data-act="research" data-sym="${esc(sym)}" data-mode="quick" ${dis}>${bz==='quick'?'চলছে…':'🔍 ৭ দিনের চেক'}</button>
  <button class="btn ghost" data-act="research" data-sym="${esc(sym)}" data-mode="deep" ${dis}>${bz==='deep'?'চলছে…':'🔬 গভীর রিসার্চ'}</button></div>
  ${bz?'<p class="sm mu" style="margin-top:6px">AI ওয়েব ঘেঁটে দেখছে, ১০-৪০ সেকেন্ড লাগতে পারে…</p>':rview(S.rep[sym])||(has?'<p class="sm mu" style="margin-top:6px">আগে রিসার্চ হয়েছে, বোতাম চাপলেই রিপোর্ট আসবে।</p>':'')}</div>`;
}
function card(x){
  S.items[x.k]=x;
  const[vt,vc]=verdict(x.sig),o=S.open===x.k;
  return`<div class="card coin" data-k="${esc(x.k)}"><div class="row">
  <div class="ring t-${vc}" style="--p:${x.score}"><i>${Math.round(x.score)}</i></div>
  <div class="grow"><b>${esc(x.sym)}</b> <span class="mu sm">${esc(x.name)}</span><div class="sm mu">আজ ${pc(x.d1)} &nbsp;৭ দিনে ${pc(x.d7)}</div></div>
  <div class="rt"><b${x.m==='NSE'?` data-px="${esc(x.sym)}"`:''}>${inr(x.price)}</b><div><span class="pill t-${vc}">${vt}</span></div>${x.m==='CRYPTO'?rbadge(x.sym):''}</div></div>
  ${o?`<div class="det"><div class="grid">
  <div><span>টার্গেট (লাভ)</span><b class="up">${inr(x.tp)}</b></div>
  <div><span>স্টপ-লস (সীমা)</span><b class="dn">${inr(x.sl)}</b></div>
  <div><span>কতদিন ধরে রাখবে</span><b>${esc(x.hold)}</b></div>
  <div><span>৩০ দিনে</span>${pc(x.d30)}</div>
  <div><span>RSI</span><b>${x.rsi}</b></div>
  <div><span>ট্রেন্ডের জোর (ADX)</span><b>${x.adx}</b></div></div>
  ${x.m==='CRYPTO'?rpanel(x.sym):''}
  <div class="row gap"><input class="amt" type="number" inputmode="numeric" min="100" value="${x.m==='NSE'?5000:1000}" aria-label="টাকার অঙ্ক">
  <button class="btn" data-act="buy" data-k="${esc(x.k)}">পেপার বাই</button>
  ${x.m==='CRYPTO'?`<a class="btn ghost" href="/coin.html?symbol=${esc(x.sym)}">বিশ্লেষণ দেখো</a>`:''}</div>
  <p class="mu sm" style="margin-top:8px">এটা নকল (পেপার) ট্রেড, আসল টাকা লাগে না।</p></div>`:''}</div>`;
}
function vHome(){
  if(!S.coins&&!S.news)return S.err?errc():wait();
  const n=S.news||{},f=n.fear_and_greed||{},g=n.gemini_analysis||{},v=f.value;
  const tip=v==null?'':v<25?'বাজারে ভয় বেশি। ছোট অঙ্কে, সাবধানে।':v>75?'বাজারে লোভ বেশি। উঁচু দামে তাড়াহুড়ো করো না।':'বাজার স্বাভাবিক চলছে।';
  const picks=(S.coins?.coins||[]).filter(c=>c.swing_score>=65&&!isWait(c.signal)).slice(0,3).map(nc);
  return`<section class="card"><div class="lbl">আজ বাজারের মেজাজ</div>
  <div class="row"><div class="big">${v??'--'}</div><div><b>${FG[f.classification]||esc(f.classification||'')}</b><div class="mu sm">বিটকয়েনের দখল ${n.btc_dominance||S.coins?.btc_dominance||'--'}%</div></div></div>
  <p class="sm" style="margin-top:10px">${tip}</p>
  ${g.summary?`<p class="sm"><b>AI বলছে: ${BIAS[g.macro_bias]||''}</b><br>${esc(g.summary)}</p>`:`<p class="sm mu">AI সারাংশ এখন পাওয়া যাচ্ছে না।</p>`}</section>
  <h2>আজকের সেরা পিক</h2>
  ${picks.length?picks.map(card).join(''):`<div class="card mu">এখন কোনো নিরাপদ সেটআপ নেই। অপেক্ষা করাই ভালো।</div>`}
  <details class="card"><summary>সাম্প্রতিক খবর</summary>${(n.headlines||[]).slice(0,6).map(h=>`<p class="sm mu">${esc(h)}</p>`).join('')||'<p class="sm mu">খবর পাওয়া যায়নি।</p>'}</details>`+foot();
}
function vCoins(){
  if(!S.coins)return S.err?errc():wait();
  const F={all:'সব',buy:'কেনার মতো',wait:'অপেক্ষা'};
  let l=S.coins.coins;
  if(S.f==='buy')l=l.filter(c=>c.swing_score>=65&&!isWait(c.signal));
  if(S.f==='wait')l=l.filter(c=>isWait(c.signal));
  return`<div class="chips">${Object.keys(F).map(k=>`<button data-f="${k}" class="${S.f===k?'on':''}">${F[k]}</button>`).join('')}</div>`+
  (l.length?l.map(nc).map(card).join(''):wait('এই ফিল্টারে কিছু নেই।'))+foot();
}
const inrs=(n,d=0)=>(n<0?'−':'+')+'₹'+Math.abs(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:d});
function liveBar(){
  const L=S.sl;if(!L||!L.st)return'';
  const st=L.st,j=L.j||{alerts:[],summary:{},grades:{}},sm=j.summary||{},gb=(j.grades||{}).B||{};
  const fresh=st.streaming&&st.last_tick_age_s!=null&&st.last_tick_age_s<60;
  const[tag,c]=!st.configured?['Angel One সেটআপ হয়নি','m']:fresh?['লাইভ চালু','g']:st.prepared?['প্রস্তুত, বাজারের অপেক্ষা','b']:st.stage?['প্রস্তুত হচ্ছে','b']:['বাজারের বাইরে','m'];
  const SM={PENDING:['রিসার্চ চলছে','b'],OPEN:['চলছে','b'],WIN:['T1 ✅','g'],LOSS:['SL ❌','r'],TIME:['সময় শেষ','m'],SKIPPED:['বাদ','m']};
  const rows=(j.alerts||[]).slice().reverse().map(a=>{const[t,k]=SM[a.status]||SM.OPEN;const has=a.pnl!=null;
    const cls=has?(a.pnl>=0?'up':'dn'):'mu';
    return`<div style="margin-top:10px"><div class="row"><b>${esc(a.sym)}</b><span class="pill t-${k}" style="margin-left:8px">${t}</span><span class="grow"></span><b class="${cls}">${has?inrs(a.pnl):'–'}</b></div>
    <div class="sm mu">${esc(a.time)} · স্কোর ${esc(a.score)}${a.status==='SKIPPED'?' · '+esc(a.skip||''):` · ${a.qty||'-'} শেয়ার · ₹${Number(a.entry).toFixed(2)}${a.ltp!=null?' → ₹'+Number(a.ltp).toFixed(2):''}${a.pct!=null?' ('+(a.pct>=0?'+':'')+a.pct.toFixed(2)+'%)':''}`}</div>
    ${a.note&&a.status!=='SKIPPED'?`<div class="sm mu">🔎 ${esc(a.note)}</div>`:''}</div>`}).join('');
  return`<section class="card"><div class="row"><div class="lbl grow">লাইভ মোমেন্টাম রাডার</div><span class="pill t-${c}">${tag}</span></div>
  ${st.configured?`<div class="row" style="margin-top:8px"><div class="grow"><span class="mu sm">আজকের P&amp;L (ফি/ট্যাক্স ছাড়া)</span><div class="${(sm.pnl||0)>=0?'up':'dn'}" style="font-size:26px;font-weight:800">${inrs(sm.pnl||0)}</div></div>
  <div class="rt sm mu">রিয়েলাইজড ${inrs(sm.realized||0)}<br>খোলা ${inrs(sm.unrealized||0)}</div></div>
  <p class="sm mu" style="margin-top:6px">জয় ${sm.win||0} · হার ${sm.loss||0} · চলছে ${sm.open||0}${sm.win_rate!=null?' · win-rate '+sm.win_rate+'%':''}${sm.skipped?' · বাদ '+sm.skipped:''} · ${st.symbols} শেয়ার নজরে${st.last_tick_age_s!=null?' · ডেটা '+st.last_tick_age_s+'s আগে':''}${st.stage?' · '+esc(st.stage):''}</p>`
  :'<p class="sm mu" style="margin-top:6px">Render env-এ ANGEL_* মান বসালে লাইভ ডেটা চালু হবে।</p>'}
  ${st.error?`<p class="sm dn" style="margin-top:6px">${esc(st.error)}</p>`:''}${rows}
  ${gb.total?`<p class="sm mu" style="margin-top:10px">ছায়া (B) সিগন্যাল: ${gb.total}টি, বন্ধ ${gb.n}টির জয় ${gb.win}, হার ${gb.loss} (শুধু পরিসংখ্যান, অ্যালার্ট নয়)</p>`:''}</section>`;
}
let ES=null,lastSse=0;
function applyPx(px,n){
  document.querySelectorAll('[data-px]').forEach(e=>{const v=px[e.dataset.px];if(v)e.textContent=inr(v)});
  const ne=document.querySelector('[data-nifty]');if(ne&&n)ne.textContent=Number(n).toLocaleString('en-IN');
}
function liveOn(){
  if(ES||!window.EventSource)return;
  ES=new EventSource('/api/stocks/live/stream');
  ES.onmessage=e=>{try{const d=JSON.parse(e.data);lastSse=Date.now();S.sl={st:d.st,j:d.j};
    const el=document.getElementById('livebar');if(el)el.innerHTML=liveBar();applyPx(d.px||{},d.nifty)}catch(_){}};
}
function liveOff(){if(ES){ES.close();ES=null}}
async function refreshLive(){
  const[st,j]=await Promise.all([api('/api/stocks/live/status').catch(()=>null),api('/api/stocks/live/journal').catch(()=>null)]);
  if(st){S.sl={st,j};if(S.tab==='stocks'&&document.activeElement?.tagName!=='INPUT')render()}
}
function vStocks(){
  const d=S.stocks;
  if(S.serr)return errc();
  if(!d)return wait('শেয়ারের ডেটা আনা হচ্ছে। ১০-২০ সেকেন্ড লাগতে পারে…');
  const ok=String(d.regime).startsWith('Bullish');
  return `<div id="livebar">${liveBar()}</div><section class="card"><div class="lbl">ভারতের শেয়ার বাজার</div><div class="stat">
  <div><span class="mu sm">নিফটি ৫০</span><b data-nifty>${Number(d.nifty_50).toLocaleString('en-IN')}</b></div>
  <div><span class="mu sm">ভয়ের সূচক (VIX)</span><b>${d.india_vix}</b></div>
  <div><span class="mu sm">অবস্থা</span><b class="${ok?'up':'dn'}">${ok?'নিরাপদ':'সাবধান'}</b></div></div></section>`+
  d.stocks.map(ns).map(card).join('')+foot();
}
const pnl=t=>(t.budget_inr||0)*((t.exit_price_inr-t.buy_price_inr)/t.buy_price_inr-(t.market==='NSE'?.0025:.012));
function vTrades(){
  const T=S.trades;
  if(!T)return S.err?errc():wait();
  const w=T.filter(t=>t.status==='WIN').length,l=T.filter(t=>t.status==='LOSS').length,o=T.length-w-l;
  const net=T.reduce((s,t)=>s+(t.status!=='HOLDING'&&t.exit_price_inr&&t.buy_price_inr?pnl(t):0),0);
  const ST={HOLDING:['চলছে','b'],WIN:['টার্গেট ছুঁয়েছে','g'],LOSS:['স্টপ-লস লেগেছে','r'],EXPIRED:['মেয়াদ শেষ','m']};
  return`<section class="card"><div class="stat">
  <div><b>${o}</b><span class="mu sm">চলছে</span></div>
  <div><b class="up">${w}</b><span class="mu sm">জিত</span></div>
  <div><b class="dn">${l}</b><span class="mu sm">লস</span></div>
  <div><b>${w+l?Math.round(w/(w+l)*100):0}%</b><span class="mu sm">জেতার হার</span></div></div>
  <p class="sm ${net>=0?'up':'dn'}" style="text-align:center;margin-top:10px">মোট আনুমানিক ${net>=0?'লাভ':'লস'}: ${net>=0?'+':'-'}${inr(Math.abs(net))}<span class="mu"> (ফি ও TDS বাদে)</span></p></section>
  <div class="row gap" style="padding:0 16px;flex-wrap:wrap">
  <button class="btn" data-act="auto-c">ক্রিপ্টো অটো-স্ক্যান</button>
  <button class="btn ghost" data-act="auto-n">শেয়ার অটো-স্ক্যান</button>
  <button class="btn ghost" data-act="brief">টেলিগ্রামে ব্রিফিং</button>
  <a class="btn ghost" href="/api/trades/export">CSV ডাউনলোড</a></div>
  <h2>সব ট্রেড</h2>`+
  (T.length?T.map(t=>{
    const[s,c]=ST[t.status]||['','m'],d=new Date((t.created_at||0)*1000).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    const p=t.status!=='HOLDING'&&t.exit_price_inr&&t.buy_price_inr?pnl(t):null;
    return`<div class="card"><div class="row"><div class="grow"><b>${esc(t.symbol)}</b> <span class="mu sm">${esc(t.market||'CRYPTO')}, ${d}</span></div><span class="pill t-${c}">${s}</span><button class="ico" style="width:34px;height:34px;font-size:15px" data-act="del" data-id="${esc(t.id)}" aria-label="ট্রেড মুছো">🗑</button></div>
    <div class="grid" style="margin:10px 0 0"><div><span>কেনা</span><b>${inr(t.buy_price_inr)}</b></div><div><span>বিনিয়োগ</span><b>${inr(t.budget_inr)}</b></div>
    <div><span>টার্গেট</span><b class="up">${inr(t.target_inr)}</b></div><div><span>স্টপ-লস</span><b class="dn">${inr(t.stop_loss_inr)}</b></div></div>
    ${t.status!=='HOLDING'?`<button class="btn ghost" style="margin-top:8px;padding:6px 12px" data-act="why" data-id="${esc(t.id)}">কেন এমন হলো?</button>${(S.why[t.id]||[]).map(x=>`<p class="sm mu" style="margin-top:6px">${esc(x)}</p>`).join('')}`:''}
    ${p!==null?`<p class="sm ${p>=0?'up':'dn'}" style="margin-top:8px">${p>=0?'লাভ':'লস'} ${p>=0?'+':'-'}${inr(Math.abs(p))}${t.duration_str?`<span class="mu"> (${esc(t.duration_str)} লেগেছে)</span>`:''}</p>`:''}</div>`;
  }).join(''):`<div class="card mu">এখনো কোনো ট্রেড নেই। কোনো কয়েনে ট্যাপ করে "পেপার বাই" চাপো।</div>`)+foot();
}
function boomCard(c){
  const k='B:'+c.symbol;
  S.items[k]={k,m:'BOOM',sym:c.symbol,price:c.price_inr,tp:c.target_inr,sl:c.stop_loss_inr,hold:c.hold_label};
  const[vt,vc]=c.signal==='Boom Setup'?['বুমের লক্ষণ','g']:c.signal==='Warming Up'?['গরম হচ্ছে','b']:isWait(c.signal)?['দেরি, এখন নয়','r']:['চুপচাপ','m'];
  return`<div class="card coin" data-k="${esc(k)}"><div class="row">
  <div class="ring t-${vc}" style="--p:${c.score}"><i>${Math.round(c.score)}</i></div>
  <div class="grow"><b>${esc(c.symbol)}</b><div class="sm mu">২৪ ঘণ্টায় ${pc(c.change_24h_pct)} &nbsp;ভলিউম ${c.vol_x} গুণ</div><div class="sm mu">${esc(c.hold_label)}</div></div>
  <div class="rt"><b>${inr(c.price_inr)}</b><div><span class="pill t-${vc}">${vt}</span></div>${rbadge(c.symbol)}</div></div>
  ${S.open===k?`<div class="det">${c.ok.map(x=>`<p class="sm up">✓ ${esc(x)}</p>`).join('')}${c.no.map(x=>`<p class="sm mu">✗ ${esc(x)}</p>`).join('')}
  <div class="grid" style="margin-top:12px"><div><span>টার্গেট</span><b class="up">${inr(c.target_inr)}</b></div><div><span>স্টপ-লস (${c.sl_pct}%)</span><b class="dn">${inr(c.stop_loss_inr)}</b></div></div>
  ${rpanel(c.symbol)}
  <div class="row gap"><input class="amt" type="number" inputmode="numeric" min="100" value="1000" aria-label="টাকার অঙ্ক"><button class="btn" data-act="buy" data-k="${esc(k)}">পেপার বাই</button></div></div>`:''}</div>`;
}
function vBoom(){
  const d=S.boom;
  if(!d)return S.boomErr?errc():wait('বুম রাডার স্ক্যান করছে… ১৫-৩০ সেকেন্ড লাগতে পারে');
  const B=(S.trades||[]).filter(t=>t.market==='BOOM'),n=s=>B.filter(t=>t.status===s).length;
  return`<section class="card"><div class="lbl">বুম রাডার কী করে</div>
  <p class="sm">যেসব কয়েনে হঠাৎ ভলিউম বাড়ছে আর দাম চাপা অবস্থা থেকে ওপরে উঠছে, সেগুলো খুঁজে দেয়। এটা আগাম লক্ষণ, নিশ্চয়তা নয়। নিচের রেকর্ডই দেখাবে এটা আসলে কতটা কাজ করছে।</p>
  <div class="stat" style="margin-top:12px"><div><b>${n('HOLDING')}</b><span class="mu sm">চলছে</span></div><div><b class="up">${n('WIN')}</b><span class="mu sm">জিত</span></div><div><b class="dn">${n('LOSS')}</b><span class="mu sm">লস</span></div><div><b>${n('EXPIRED')}</b><span class="mu sm">মেয়াদ শেষ</span></div></div>
  <p class="mu sm" style="margin-top:10px">বট ৩০ মিনিটে একবার স্ক্যান করে, স্কোর ৭০+ হলে নিজে পেপার ট্রেড নেয় (একসাথে সর্বোচ্চ ৩টা)।</p></section>`+
  (d.coins.length?d.coins.map(boomCard).join(''):wait('এখন কোনো কয়েন পাওয়া যায়নি।'))+foot();
}
const foot=()=>`<p class="foot">সব ট্রেড নকল (পেপার)। এটা আর্থিক পরামর্শ নয়।</p>`;
const V={home:vHome,coins:vCoins,boom:vBoom,stocks:vStocks,trades:vTrades};
function render(){
  $('#app').innerHTML=V[S.tab]();
  document.querySelectorAll('nav [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  $('#dot').className='dot'+(S.coins?' ok':'');
}
function toast(m){const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)}
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
async function load(){
  S.err=false;
  await Promise.all([
    api('/api/scanner?limit=25').then(d=>S.coins=d).catch(()=>{}),
    api('/api/news-macro').then(d=>S.news=d).catch(()=>{}),
    api('/api/trades').then(d=>S.trades=d.trades).catch(()=>{})]);
  S.err=!S.coins&&!S.news&&!S.trades;
  api('/api/boom').then(d=>{S.boom=d;S.boomErr=false;if(S.tab==='boom'&&document.activeElement?.tagName!=='INPUT')render()}).catch(()=>{S.boomErr=true;if(S.tab==='boom')render()});
  api('/api/research').then(d=>{S.res=d.items||{};if(document.activeElement?.tagName!=='INPUT')render()}).catch(()=>{});
  if(S.tab==='stocks')await loadStocks(true);
  if(document.activeElement?.tagName!=='INPUT')render();
}
async function loadStocks(quiet){
  S.serr=false;if(!quiet){S.stocks=null;render()}
  try{S.stocks=await api('/api/stocks/scanner')}catch(_){S.serr=true}
  refreshLive();
  if(!quiet)render();
}
function go(t){S.tab=t;S.open=null;render();scrollTo(0,0);if(t==='stocks'){refreshLive();liveOn();if(!S.stocks)loadStocks()}else liveOff()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)liveOff();else if(S.tab==='stocks')liveOn()});
async function act(a){
  const k=a.dataset.act;
  if(k==='refresh'){toast('রিফ্রেশ হচ্ছে…');await load();return}
  if(k==='del'&&!confirm('এই ট্রেডটা মুছে ফেলবে?'))return;
  a.disabled=true;
  try{
    if(k==='why'){
      const id=a.dataset.id;S.why[id]=(await api('/api/trades/'+encodeURIComponent(id)+'/why')).why;render();return;
    }
    if(k==='del'){
      await api('/api/trades/'+encodeURIComponent(a.dataset.id),{method:'DELETE'});
      S.trades=(await api('/api/trades')).trades;render();toast('ট্রেড মুছে ফেলা হয়েছে');return;
    }
    if(k==='research'){
      const sym=a.dataset.sym,mode=a.dataset.mode;
      S.rb[sym]=mode;render();
      try{S.rep[sym]=await api('/api/research/'+encodeURIComponent(sym)+'?mode='+mode);api('/api/research').then(d=>{S.res=d.items||{};render()}).catch(()=>{})}
      catch(_){toast('রিসার্চ হয়নি। আবার চেষ্টা করো।')}
      delete S.rb[sym];render();return;
    }
    if(k==='buy'){
      const x=S.items[a.dataset.k],amt=parseFloat(a.closest('.det').querySelector('.amt').value);
      if(!(amt>=100)){toast('কমপক্ষে ₹100 দাও');return}
      await api('/api/trades',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:x.sym,market:x.m,budget_inr:amt,buy_price_inr:x.price,target_inr:x.tp,stop_loss_inr:x.sl,hold_label:x.hold})});
      S.trades=(await api('/api/trades')).trades;S.open=null;render();toast(x.sym+' এ ₹'+amt+' এর পেপার বাই হয়েছে');
    }else if(k==='auto-c'||k==='auto-n'){
      const d=await api(k==='auto-c'?'/api/alerts/auto-cycle':'/api/stocks/auto-cycle',{method:'POST'});
      toast(d.auto_logged?.length?'কেনা হয়েছে: '+d.auto_logged.join(', '):'এখন কোনো নতুন ভালো সেটআপ নেই');
      S.trades=(await api('/api/trades')).trades;render();
    }else if(k==='brief'){
      const d=await api('/api/alerts/briefing',{method:'POST'});toast(d.sent?'টেলিগ্রামে পাঠানো হয়েছে':(d.detail||'টেলিগ্রাম সেট করা নেই'));
    }
  }catch(_){toast('কাজটি হয়নি। আবার চেষ্টা করো।')}finally{a.disabled=false}
}
document.addEventListener('click',e=>{
  const t=e.target,tab=t.closest('[data-tab]');
  if(tab)return go(tab.dataset.tab);
  const f=t.closest('[data-f]');if(f){S.f=f.dataset.f;return render()}
  const a=t.closest('[data-act]');if(a)return act(a);
  if(t.closest('.det,a,details'))return;
  const c=t.closest('.coin');if(c){S.open=S.open===c.dataset.k?null:c.dataset.k;render()}
});
render();load();setInterval(load,300000);setInterval(()=>{if(S.tab==='stocks'&&Date.now()-lastSse>10000){if(S.sl&&S.sl.st&&S.sl.st.streaming)loadStocks(true);else refreshLive()}},30000);
</script>
</body>
</html>
